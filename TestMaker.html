<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>テスト問題メーカー</title>
<!--
=====================================================================
 テスト問題メーカー  ／  引き継ぎメモ（担当者が変わった場合はここから読む）
=====================================================================
 ■ これは何か
   マークシート式の定期テストの「問題用紙」を作るアプリ。
   空欄番号・選択肢の記号(ア〜)・正答一覧・体裁を自動で整え、
   画面プレビュー / 印刷(PDF) / Word(.docx) / 正答CSV を出力する。

 ■ 動かし方
   このHTMLファイルをChromeかEdgeで開くだけ。インターネット不要・インストール不要。
   外部ライブラリ・外部通信は一切使っていない（10年後も動くことを優先）。

 ■ データの置き場所
   1) データファイル: 先生が選んだ「テスト問題メーカー_データ.json」(ふつうはこのHTMLと同じフォルダ)。
      変更のたびに自動で上書き保存する(Chrome/Edge のファイルへの直接保存の機能)。中身はバックアップと同じ形＋履歴。
      選んだファイルは IndexedDB(名前 "testmaker")に覚える。開き直すと編集の許可をもう一度求められることがある。
   2) 予備: ブラウザ内(localStorage キー "testmaker:v1")。データファイルを使っていないとき・保存できないときの控え。
      ※ ブラウザの種類・アカウント・PCごとに別々になるので、これだけに頼らない。
   3) バックアップ: 画面上部「バックアップ保存」で出る日付入りのJSONファイル。学期ごと・大きく編集した後に保存する。

 ■ コードの構成（この順に並んでいる。直す場所の目安）
   1. 定数・初期データ      … 記号セット、フォント、サンプルテスト(sampleExam)
   2. データ(JSON)の形      … newExam / newSection / migrate（形を変えたら SCHEMA を上げる）
   3. compile(exam)         … ★中心。入力データ → 番号・記号・正答・警告を計算
   4. 出力: HTML / 正答 / CSV / Word … すべて compile の結果だけを見て作る
      (体裁を変えたい → renderPaperHTML と buildDocx を直す)
   5. 保存(storage)・バックアップ・履歴
   6. 画面(editor)         … 入力フォーム。ここは見た目だけ。計算はしない
   ★ ブロックの欄: blockTree(書き方→木) / blocksSVG(画面・印刷) / blocksPng(Word)。コードの欄の「種類」で選ぶ。
   ★ 自動ルビ: rubySegs()（優先順 手書き→登録辞書→自動）。辞書エンジンは別ファイル ruby-engine.js（無くても他は動く）
   ★ 新しい問題の種類を足すとき: newSection / compile / 各render / editor に1つずつ足す。

 ■ 空欄の書き方（本文の中で）
   {{語句}}   … 空欄にする。語句が正解になり、語群に自動で入る。番号は自動。
   {{@語句}}  … 同じ大問内で先に出た「語句」の空欄と同じ番号で再登場させる。
   〔図:見出し〕… その見出しの図の番号(テスト全体の通し番号)に置き換わる。例「〔図:回路図〕を見て」→「図３を見て」。

 ■ 図(画像)
   大問ごとに図を入れられる(ファイル選択・貼り付け・ドラッグ)。置き場所は本文の上/下/右。
   設問(選択・正誤・記述の1問ずつ)にも図を入れられる。置き場所は問題文の下/右。番号は用紙に出る順の通し番号。
   選択肢も図にできる(choices は {text, img})。図は同じ高さの枠にそろえて並べる(choiceCols・choiceH)。
   画像の中身は store.images に1か所でまとめ、大問には id だけを持たせる(履歴で画像が増えないように)。→「画像(図)」の節
   Word出力にも入る(buildDocx の前に docxImages() で PNG/JPEG にそろえる。SVG と「白黒にする」は canvas で作り直す)。

 ■ コードの欄(プログラム)
   大問ごとに1つ。書いたとおりの字下げで、等幅の字(BIZ UDゴシック)・枠囲み・ルビなしで出す。行番号は付けても付けなくてもよい。
   語群選択の大問では、コードの中の {{答え}} も本文と同じ空欄になる(番号は上から順。コードが「本文の前」ならコードが先)。→ codeOf / codeHTML / codeXml
=====================================================================
-->
<style>
:root{
  --bg:#f3f5f7; --panel:#fff; --line:#d5dbe1; --ink:#1f2933; --sub:#5b6773;
  --accent:#1f6feb; --accent-d:#1858bd; --warn:#b45309; --warn-bg:#fff4e0; --danger:#c62828; --ok:#1b7a3d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","BIZ UDPゴシック","Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100vh}

/* ---- top bar ---- */
.top{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.top h1{font-size:17px;margin:0 6px 0 0;white-space:nowrap}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp.sep{padding-left:14px;border-left:1px solid var(--line)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#eef3fb;border-color:#b9c7dc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--accent-d)}
.btn.small{padding:2px 8px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--danger)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9cc2ff;outline-offset:1px}
select.examsel{max-width:260px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:700}
.status{font-size:13px;color:var(--sub)}
.badge-bk{font-size:13px;padding:3px 10px;border-radius:99px;background:#e6f4ea;color:var(--ok);cursor:pointer;border:0}
.badge-bk.dirty{background:var(--warn-bg);color:var(--warn);font-weight:700}
/* データファイルの状態の帯(上部)。注意が要るときだけ目立たせる */
.filebar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 14px;font-size:14px;background:#fff;border-bottom:1px solid var(--line);color:var(--sub)}
.filebar.warn{background:var(--warn-bg);color:var(--warn);font-weight:700}
.filebar.bad{background:#fdecea;color:var(--danger);font-weight:700}
.filebar .btn{font-weight:400;color:var(--ink);background:#fff}
.filebar .btn.primary{color:#fff;background:var(--accent);font-weight:700}
.fchoice{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.fchoice .btn{text-align:left;white-space:normal;padding:10px 14px;font-size:16px}
.fchoice .btn small{display:block;font-size:13px;font-weight:400;opacity:.9;margin-top:2px}

/* ---- main ---- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,44%) 1fr;gap:12px;padding:12px}
.col{min-height:0;display:flex;flex-direction:column}
.editor{overflow:auto;padding-right:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.field{display:block;margin:8px 0}
.field>span{display:block;font-size:12.5px;color:var(--sub);margin-bottom:2px}
.field input[type=text],.field input[type=number],.field textarea,.field select,input.grow,textarea.grow{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.field textarea{resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.row>.field{flex:1;min-width:120px}
.hint{font-size:12.5px;color:var(--sub);margin:2px 0 6px}
details.card>summary{cursor:pointer;font-weight:700;font-size:15px}
.sc-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sc-head input.grow{flex:1;min-width:160px;font-weight:700}
.badge{background:#1f2933;color:#fff;border-radius:6px;padding:2px 9px;font-weight:700;white-space:nowrap}
.tag{font-size:12px;background:#e8eef7;color:#264b87;border-radius:6px;padding:2px 8px;white-space:nowrap}
.sub{background:#f8fafc;border:1px solid #e3e8ee;border-radius:10px;padding:8px 10px;margin:8px 0}
.sub .qhead{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.qno{font-weight:700;color:#264b87}
.copt{display:flex;gap:6px;align-items:center;margin:3px 0}
.copt .lab{width:1.8em;text-align:center;font-weight:700}
.copt .cthumb{width:44px;height:32px;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:#fff}
.copt input[type=text]{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.blankmap{font-size:13px;color:var(--sub);background:#f8fafc;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;line-height:1.7}
.blankmap b{color:var(--ink)}
textarea.codeta{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;resize:vertical;
  font-family:"BIZ UDGothic","BIZ UDゴシック","MS Gothic",monospace;line-height:1.6;white-space:pre;overflow-x:auto;tab-size:4}
.card.drop{outline:3px dashed var(--accent);outline-offset:2px}
.itemfig{background:#fff;margin:6px 0 0}
.figed{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #e3e8ee;padding-top:8px;margin-top:8px}
.figed .thumb{width:96px;height:72px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;flex:none}
.figed .thumb.gray{filter:grayscale(1)}
.figed .thumb.miss{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--danger);border-style:dashed}
.figed-b{flex:1;min-width:0}
.figed input.grow{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.card input.w5,.sub input.w5,.figed input.w5{width:4.5em;border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 40px}

/* ---- preview ---- */
.preview{overflow:auto;background:#cfd6de;border-radius:12px;padding:12px;position:relative}
.ptabs{display:flex;gap:6px;align-items:center;margin-bottom:8px;position:sticky;top:-12px;z-index:3;background:#cfd6de;padding:6px 0}
.ptab{border:1px solid #9aa7b5;background:#fff;border-radius:99px;padding:4px 14px;cursor:pointer}
.ptab.on{background:#1f2933;color:#fff;border-color:#1f2933}
.warns{background:var(--warn-bg);border:1px solid #f0cf94;color:#6b3f06;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13.5px}
.warns.ok{background:#e6f4ea;border-color:#b6dfc2;color:#14532d}
.warns ul{margin:4px 0 0;padding-left:1.2em}

/* ---- the paper (screen + print) ---- */
.sheet{background:#fff;width:210mm;padding:14mm var(--mx,14mm);margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.25);color:#000;
  font-size:var(--fs,11pt);line-height:1.75;transform-origin:top center}
.sheet *{box-sizing:border-box}
.p-date{text-align:right;font-size:9pt}
.p-title{text-align:center;font-weight:700;font-size:1.3em;margin:2mm 0 0;line-height:1.4}
.p-kind{text-align:center;font-weight:700;font-size:1.9em;letter-spacing:.35em;margin:0 0 3mm;line-height:1.3}
/* 氏名欄：年・組・番は同じ幅(15mm)、名前は残りいっぱい。Word も同じ形(buildDocx) */
.p-name{display:flex;align-items:flex-end;gap:2mm;margin:0 0 4mm auto;width:62%;font-size:1em}
.p-name .ln{display:inline-block;border-bottom:1px solid #000;width:15mm;flex:none;height:1.6em}
.p-name .ln.w{flex:1;width:auto}
/* 行間：--ls(行間の倍率)をかける。数字は Word の段落の行間(P の line ÷ 200)と同じ */
.p-notice{border:1.5px solid #000;border-radius:3px;padding:2mm 4mm;margin:0 0 3mm;font-weight:700;font-size:.95em;line-height:calc(1.5 * var(--ls,1))}
.p-notice div{padding-left:1.2em;text-indent:-1.2em}
.p-intro{margin:0 0 3mm;text-indent:1em;line-height:calc(1.7 * var(--ls,1))}
.sec{margin-top:5mm}
.para.last{break-after:avoid}
@media print{.sec.pb{break-before:page;margin-top:0}}
.sec h2{display:flex;align-items:center;gap:3mm;margin:0 0 2mm;padding-bottom:1mm;border-bottom:2px solid #000;font-size:1.15em;line-height:1.5;break-after:avoid}
.sec h2 .no{background:#000;color:#fff;border-radius:2px;min-width:1.7em;text-align:center;padding:0 .25em;font-weight:700}
.sec h2 small{font-weight:400;font-size:.85em;margin-left:auto;white-space:nowrap}
.lead{margin:0 0 1.5mm;text-indent:1em;line-height:calc(1.65 * var(--ls,1))}
.note{margin:0 0 1.5mm;font-size:.92em;padding-left:1.2em;text-indent:-1.2em;line-height:calc(1.6 * var(--ls,1))}
.para{margin:0 0 1mm;text-indent:1em;text-align:justify;line-height:calc(2 * var(--ls,1));orphans:2;widows:2}
.blank{font-weight:700;border:1.5px solid #000;padding:0 .15em;margin:0 .1em;white-space:nowrap}
.bank{border:1.5px solid #000;margin:2mm 0 1mm;break-inside:avoid}
.bank-h{border-bottom:1.5px solid #000;padding:.2mm 3mm;font-size:.95em}
.bank-h span{margin-left:1em;font-size:.9em}
.bank-g{display:grid;padding:1mm 2mm}
.bank-g div{padding:.5mm 1mm;line-height:calc(1.65 * var(--ls,1))}
.lab{display:inline-block;font-weight:700;border:1px solid #000;min-width:1.45em;text-align:center;line-height:1.3;margin-right:.35em;font-size:.95em}
.q{margin:1.2mm 0;break-inside:avoid;padding-left:3.9em}
.q-t{text-indent:-3.9em;line-height:calc(1.7 * var(--ls,1))}
.q-t .qn{display:inline-block;width:3.9em;white-space:nowrap;text-indent:0;font-weight:700}
.q-c{display:grid;margin-top:.5mm}
.q-c div{line-height:calc(1.6 * var(--ls,1));padding-right:2mm}
.ansbox{border:1px solid #000;margin:1mm 0 0;background:#fff}
/* 図。ページの途中で切らない。白黒印刷が前提なので、色は「白黒にする」で画面でも灰色の濃さで確かめられる */
.figs{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2mm 3mm;margin:2mm 0}
.fig{margin:0;break-inside:avoid;text-align:center}
.fig img{display:block;max-width:100%;height:auto;margin:0 auto}
.fig img.gray{filter:grayscale(1)}
.fig figcaption{font-size:.92em;line-height:1.5;margin-top:1mm}
.fig-miss{border:1.5px dashed #000;padding:6mm 2mm;font-size:.9em}
.code{border:1.5px solid #000;padding:1.5mm 3mm;margin:2mm 0;font-size:.95em;line-height:1.7;break-inside:avoid;
  font-family:"BIZ UDGothic","BIZ UDゴシック","MS Gothic","MS ゴシック",monospace}   /* 等幅の字(Wordは CODE_FONT) */
.code .cl{display:flex;white-space:pre}
.code .ln{flex:none;margin-right:3mm;padding-right:2mm;border-right:1px solid #000;text-align:right;white-space:pre}
.code .ct{white-space:pre-wrap;word-break:break-all}
.code .blank{font-family:inherit}
.ruby-on .code{line-height:1.8}
.blocks{margin:2mm 0;break-inside:avoid}
.blocks svg{display:block;max-width:100%;height:auto}
.q-ci{display:grid;gap:2mm 4mm;margin-top:1mm}
.ci{position:relative;break-inside:avoid;text-align:center}
.ci .lab{position:absolute;left:0;top:0;z-index:1;background:#fff}
.ci-box{display:flex;align-items:center;justify-content:center;padding:1mm 0 1mm 1.8em}
.ci-box img{max-width:100%;max-height:100%;object-fit:contain}
.ci-t{line-height:1.5;margin-top:.5mm}
.figrow{display:flow-root}
/* 右の図：横並び(flex)だと印刷でページをまたげず、大問がまるごと次のページに送られたので、回り込み(float)にした。
   本文は flow-root で図の左の列にまとめる(Word の2列の表と同じ見た目) */
.figside{float:right;margin:1mm 0 1mm 4mm}
.figside .fig+.fig{margin-top:3mm}
.figmain{display:flow-root}
.ruby-on .fig figcaption{line-height:2}
.sheet .pt{font-size:.85em;margin-left:.5em}
.sheet ruby rt{font-size:.55em;font-weight:400;line-height:1}
/* ルビ付きの行は、ルビの分だけ高さが要る(Word も自動で行を高くする)。--rf より狭くはしない */
.sheet.ruby-on{line-height:2.2;--rf:2}
.ruby-on .para{line-height:max(calc(2 * var(--ls,1)), var(--rf))}
.ruby-on .p-title{line-height:2.1}
.ruby-on .p-kind{line-height:1.9}
.ruby-on .q-t,.ruby-on .q-c div,.ruby-on .bank-g div,.ruby-on .lead,.ruby-on .note,.ruby-on .p-notice,.ruby-on .p-intro{line-height:max(calc(1.7 * var(--ls,1)), var(--rf))}
.edtool{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:2px 0 8px}
.p-end{margin-top:6mm;text-align:center;font-size:.9em}
/* answer key */
.k-title{text-align:center;font-weight:700;font-size:1.5em;margin-bottom:1mm}
.k-sub{text-align:center;margin-bottom:4mm;font-size:.95em}
.k-sec{break-inside:avoid;margin-bottom:4mm}
.k-sec h2{font-size:1em;margin:0 0 1mm;border-bottom:1.5px solid #000}
.k-grid{columns:2;column-gap:8mm}
.k-row{display:flex;gap:3mm;border-bottom:1px dotted #000;padding:.3mm 0;line-height:1.6;break-inside:avoid}
.k-row .n{width:3em;font-weight:700;text-align:right}
.k-row .a{width:2.2em;font-weight:700;text-align:center}
.k-row .t{flex:1}
.k-row .p{width:3em;text-align:right}

/* ---- dialogs / toast ---- */
dialog{border:0;border-radius:14px;padding:0;max-width:min(760px,94vw);width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:18px 22px;max-height:80vh;overflow:auto}
.dlg h2{margin:0 0 8px;font-size:18px}
.dlg h4{margin:14px 0 4px}
.dlg code{background:#eef2f6;padding:1px 5px;border-radius:4px}
.dlg ul{margin:4px 0;padding-left:1.3em}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.on{opacity:1}

@media (max-width:1000px){
  .app{height:auto}.main{grid-template-columns:1fr}.editor{max-height:none}
}
/* ---- print: show only the sheet ---- */
@media print{
  html,body{height:auto;background:#fff}
  .app,#toast,dialog{display:none!important}
  #printRoot{display:block!important}
  #printRoot .sheet{zoom:1!important;width:auto;padding:0;margin:0;box-shadow:none}
}
#printRoot{display:none}
.pfoot{display:none}
@media print{.pfoot{display:block}}
</style>
<style>
/* 印刷：@page の余白を0にするとブラウザが付ける日時・URLの欄が出なくなる。
   代わりに表の thead/tfoot（毎ページ繰り返される）で上下の余白を作る */
@page{size:A4;margin:0}
@media print{
  .pt{width:100%;border-collapse:collapse}
  .pt td{padding:0}
  .pt thead td{height:var(--mt,14mm)}
  .pt tfoot td{height:var(--mb,16mm)}
  .pfoot{position:fixed;left:var(--mx,14mm);right:var(--mx,14mm);bottom:5mm;font-size:8pt;line-height:1.3;color:#000}
  #printRoot .sheet{padding:0 var(--mx,14mm)!important}
  .sec.keep{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>テスト問題メーカー</h1>
    <div class="grp">

<script>
'use strict';
/* =====================================================================
   1. 定数・初期データ
   ===================================================================== */
const SCHEMA = 7;                       // データの形のバージョン。形を変えたら上げて migrate() に処理を書く

                                        // 7(2026-10-29): 体裁に行間(lineSpacing)・余白(margin)・改ページ「大問の途中で変えない」(pageMode: keep)・ページ数(fitPages)
const LS_KEY = 'testmaker:v1';
const LABEL_SETS = {

};
const LABEL_NAMES = { kana:'ア・イ・ウ…（カタカナ）', maru:'①・②・③…', abc:'A・B・C…' };
const FONTS = [
  ['BIZ UDPゴシック','"BIZ UDPGothic","BIZ UDPゴシック","Yu Gothic","Meiryo",sans-serif'],
  // 教科書体：Chrome/Edge は「NP-R」の名前では見つけられず、次の HG教科書体 で出ていた(2026-10-29 に確かめた)。
  // Windows の字体の家族名は「UD デジタル 教科書体 NP」なので、それを先に書く。Word は左の名前(NP-R)で見つけられる
  ['UD デジタル 教科書体 NP-R','"UD Digi Kyokasho NP","UD デジタル 教科書体 NP","UD Digi Kyokasho NP-R","UD デジタル 教科書体 NP-R","HG教科書体","Yu Mincho",serif'],
  ['HG教科書体','"HGKyokashotai","HG教科書体","HGP教科書体","UD デジタル 教科書体 NP-R","Yu Mincho",serif'],
  ['BIZ UDP明朝','"BIZ UDPMincho","BIZ UDP明朝","Yu Mincho","MS PMincho",serif'],
  ['游ゴシック','"Yu Gothic","游ゴシック","Meiryo",sans-serif'],
  ['游明朝','"Yu Mincho","游明朝","MS PMincho",serif'],
  ['MS ゴシック','"MS Gothic","MS ゴシック",monospace'],
  ['MS 明朝','"MS Mincho","MS 明朝",serif'],
];
const FIG_POS = { above: '本文の上', below: '本文の下', right: '本文の右' };
/* 体裁：行間と余白。画面・印刷と Word で同じ値を使う(見た目をそろえるため)。
   行間は倍率。Word の段落の行間(P の line)と、画面の line-height の両方にかける */
const LINE_SPACING = { tight: ['狭め', 0.88], normal: ['ふつう', 1], loose: ['広め', 1.15] };
const MARGINS = { normal: ['ふつう', { t: 14, b: 16, x: 14 }], narrow: ['狭め', { t: 10, b: 13, x: 10 }] };   // mm(上・下・左右)
const PAGE_MODES = { keep: '詰めるが、大問の途中ではページを変えない（入らない大問は次のページへ）', flow: '続けて詰める（大問の途中でもページが変わる）', section: '大問ごとに改ページ' };
const lsOf = m => (LINE_SPACING[m.lineSpacing] || LINE_SPACING.normal)[1];
const mgOf = m => (MARGINS[m.margin] || MARGINS.normal)[1];
const CHOICE_COLS = { auto: '自動', 1: '1列', 2: '2列', 4: '4列' };
const ITEM_FIG_POS = { below: '問題文の下', right: '問題文の右' };
const CODE_KIND = { text: '文字のコード', blocks: 'ブロック（MakeCode のような）' };
const CODE_POS = { before: '本文の前', after: '本文の後' };
const CODE_FONT = 'BIZ UDゴシック';     // コードの欄の字(等幅。Windows10以降に標準搭載)。字の幅がそろうので字下げが崩れない
const IMG_MAX = 1600;                    // 画像を読み込むときの長い辺の上限(px)。A4に印刷しても線がつぶれない程度。容量を抑えるため
const TYPE_NAMES = { blank:'語群選択（空欄補充）', choice:'選択問題（問ごとの選択肢）', tf:'正誤問題', written:'記述問題' };

/* ---- ユーティリティ ---- */
const $  = (s, r=document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zen = n => String(n).replace(/\d/g, d => String.fromCharCode(d.charCodeAt(0) + 0xFEE0));
const num = (v, d=0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2,'0');
const stamp = (t=Date.now()) => { const d=new Date(t); return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`; };
const fmtTime = t => { const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const vlen = s => { let n=0; for (const ch of plain(s)) n += /[\x20-\x7e]/.test(ch) ? 0.55 : 1; return n; };
const hash32 = str => { let h=2166136261; for (let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; };
/* ルビ記法：[漢字|かんじ]。ルビ表示OFFのときは漢字だけを出す */
const RUBY_RE = /\[([^\[\]|]+)\|([^\[\]|]*)\]/g;
/* 図の番号の記法：〔図:見出し〕(コロンは全角でもよい) → compile で「図３」に置き換わる。{{ }} や [漢字|かな] とぶつからない括弧にした */
const FIG_REF_RE = /〔図[:：]([^〔〕]*)〕/g;
const plain = s => String(s).replace(RUBY_RE, '$1');
let RUBY = false;                                   // ルビを出力するか（出力時に meta.showRuby を入れる）
let AUTO = false;                                   // 自動ルビを使うか
let RUBY_LOG = null;                                // 確認ダイアログ用：出てきた語を集める
const KANJI_RE = /[㐀-䶿一-鿿々〆]/;
const hira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const AUTO_CACHE = new Map();
const BUILTIN_DICT = { '令': 'れい', '語': 'ご' };   // 自動の読みが誤りやすい語の標準辞書（登録辞書が優先される）。足したいときはここへ

/* ルビの決め方（優先順）: ①手で書いた [漢字|よみ]  ②登録辞書(store.userDict)  ③自動(kuromoji)
   結果は [{t:文字, r:よみ|null}] の並び。HTML・Wordの両方がこれを使う */
function rubySegs(s) {
  s = String(s); const out = []; let pos = 0, m; RUBY_RE.lastIndex = 0;
  const pushAuto = t => { if (!t) return; if (AUTO && KANJI_RE.test(t)) out.push(...autoSegs(t)); else out.push({ t, r: null }); };
  while ((m = RUBY_RE.exec(s))) { pushAuto(s.slice(pos, m.index)); out.push({ t: m[1], r: m[2] }); pos = RUBY_RE.lastIndex; }
  pushAuto(s.slice(pos));
  return out;
}
function autoSegs(text) {
  let r = !RUBY_LOG && AUTO_CACHE.get(text);
  if (!r) {
    r = []; tokenizeAuto(text).forEach(tk => r.push(...tokSegs(tk)));
    r = r.reduce((a, g) => { const l = a[a.length - 1]; if (l && !l.r && !g.r) l.t += g.t; else a.push({ ...g }); return a; }, []);
    if (!RUBY_LOG) AUTO_CACHE.set(text, r);
  }
  return r;
}
function tokenizeAuto(text) {
  if (window.RubyEngine && window.RubyEngine.ready) return window.RubyEngine.tokenize(text);
  const keys = Object.keys((store && store.userDict) || {}).filter(Boolean).sort((a, b) => b.length - a.length);   // 辞書エンジンがない時は登録辞書の最長一致だけ
  const out = []; let i = 0;
  while (i < text.length) { const k = keys.find(k => text.startsWith(k, i)); if (k) { out.push({ s: k, rd: null }); i += k.length; } else { out.push({ s: text[i], rd: null }); i++; } }
  return out;
}
function tokSegs(tk) {
  const s = tk.s;
  if (!KANJI_RE.test(s)) return [{ t: s, r: null }];
  const ud = (store && store.userDict) || {};
  let rd = null, src = 'none';
  if (Object.prototype.hasOwnProperty.call(ud, s)) { rd = ud[s]; src = 'dict'; }
  else if (BUILTIN_DICT[s]) { rd = BUILTIN_DICT[s]; src = 'std'; }
  else if (tk.rd) { rd = hira(tk.rd); src = 'auto'; }
  if (RUBY_LOG && !RUBY_LOG.has(s)) RUBY_LOG.set(s, { reading: rd || '', src });
  return rd ? alignRuby(s, rd) : [{ t: s, r: null }];
}
/* 「扱う／あつかう」→ 扱 だけにルビ（送り仮名を除く）。合わなければ語全体にルビ */
function alignRuby(s, rd) {
  const runs = s.match(/[㐀-䶿一-鿿々〆]+|[^㐀-䶿一-鿿々〆]+/g) || [s];
  if (runs.length === 1) return [{ t: s, r: rd }];
  const lit = x => hira(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const m = new RegExp('^' + runs.map(x => KANJI_RE.test(x[0]) ? '(.+?)' : lit(x)).join('') + '$').exec(rd);
  if (!m) return [{ t: s, r: rd }];
  let g = 1; return runs.map(x => KANJI_RE.test(x[0]) ? { t: x, r: m[g++] } : { t: x, r: null });
}
function escR(s) {
  if (!RUBY) return esc(plain(s));
  return rubySegs(s).map(g => g.r ? `<ruby>${esc(g.t)}<rt>${esc(g.r)}</rt></ruby>` : esc(g.t)).join('');
}
const escP = s => esc(plain(s));
const safeName = s => String(s||'test').replace(/[\\/:*?"<>|]/g,'_').slice(0,60);

/* =====================================================================
   2. データ(JSON)の形
   ===================================================================== */
function newMeta() {
  return {
    date: '', title: '令和　年度　　学年　　　　　第　学期定期テスト', kind: '問題用紙',
    notice: 'マークシートは機械で読み取ります。解答用紙の記入例を参考に、枠からはみ出さないよう、濃くていねいに塗りつぶしなさい。\n読み取れないものや、２か所以上塗りつぶしたものは、原則として×とします。',
    intro: '各問題の指示にしたがって、解答用紙のマークシートの記号を塗りつぶしなさい。',
    showName: true, font: FONTS[0][0], size: 11, labelSet: 'kana', bankCols: 0,
    showPoints: true, maxChoices: 10, showRuby: true, autoRuby: true, pageMode: 'keep', keepBank: true,
    lineSpacing: 'normal', margin: 'normal', fitPages: 2,
    footer: '本教材のすべての権利は作成者が保有しています。本教材の内容は無断で複製、配布、転載することを禁じます。'
  };
}
const newChoice = (text = '') => ({ text, img: null });
// 設問の図：figures は大問と同じ形。figPos: below|right(問題文の下/右)
function newItem(type) {
  const f = { figures: [], figPos: 'below' };
  // 選択肢：{text, img(store.images の id か null)}。choiceCols: 図の選択肢の並べ方(auto|1|2|4)、choiceH: 図の枠の高さ(mm)
  if (type === 'choice')  return { id: uid(), text: '', choices: [newChoice(), newChoice(), newChoice(), newChoice()], correct: 0, choiceCols: 'auto', choiceH: 30, ...f };
  if (type === 'tf')      return { id: uid(), text: '', correct: 0, ...f };          // 0=正しい 1=間違い
  if (type === 'written') return { id: uid(), text: '', answer: '', lines: 3, points: 3, ...f };
}
function newSection(type) {
  // figures: [{id, img(store.images の id), caption(見出し), width(用紙の幅の%), gray(白黒にする)}]  figPos: above|below|right(本文の上/下/右)
  // code: null(コードの欄なし) または プログラムの文字列。codePos: before|after(本文の前/後)。codeLines: 行番号を付けるか
  // codeKind: text(文字のコード)|blocks(ブロックの欄)。blockScale: ブロックの大きさ(%)
  const base = { id: uid(), type, title: '', lead: '', points: 2, collapsed: false, figures: [], figPos: 'above', code: null, codePos: 'before', codeLines: true, codeKind: 'text', blockScale: 100 };
  if (type === 'blank')   return { ...base, text: '', distract: '', order: 'shuffle', seed: Math.floor(Math.random()*1e9), manual: '',
                                  bankNote: '※　同じ語句を何度使っても良い。使わない語句もある。' };
  if (type === 'choice')  return { ...base, items: [newItem('choice')] };
  if (type === 'tf')      return { ...base, lead: '次の文が正しいか、間違っているかを考えて答えなさい。', trueLabel: '正しい', falseLabel: '間違っている', items: [newItem('tf')] };
  if (type === 'written') return { ...base, lead: '次の問いに、枠の中に答えなさい。', items: [newItem('written')] };
}
function newExam(name, meta) {
  return { app:'testmaker', schema: SCHEMA, id: uid(), name: name || '新しいテスト', updatedAt: Date.now(),
           meta: meta ? clone(meta) : newMeta(), sections: [ newSection('blank') ] };
}
/* 古い形のデータを今の形へ。足りない項目を補うだけで、既存の値は消さない */
function migrate(ex) {
  ex.schema = SCHEMA;
  ex.id = ex.id || uid();
  ex.name = ex.name || '無題のテスト';
  ex.meta = Object.assign(newMeta(), ex.meta || {});
  ex.sections = (ex.sections || []).map(s => {
    const d = newSection(s.type in TYPE_NAMES ? s.type : 'blank');
    const m = Object.assign(d, s);
    const figs = a => (a || []).filter(f => f && f.img).map(f => Object.assign({ id: uid(), caption: '', width: 50, gray: false }, f));
    if (m.items) m.items = m.items.map(it => {
      const o = Object.assign(newItem(m.type) || {}, it, { id: it.id || uid() });
      o.figures = figs(o.figures); if (!ITEM_FIG_POS[o.figPos]) o.figPos = 'below';
      if (o.choices) o.choices = o.choices.map(c => typeof c === 'string' ? newChoice(c) : Object.assign(newChoice(), c));   // schema 5 までは文字列
      if (o.choices && !CHOICE_COLS[o.choiceCols]) o.choiceCols = 'auto';
      return o;
    });
    m.figures = figs(m.figures);
    if (!FIG_POS[m.figPos]) m.figPos = 'above';
    if (typeof m.code !== 'string') m.code = null;
    if (!CODE_POS[m.codePos]) m.codePos = 'before';
    if (!CODE_KIND[m.codeKind]) m.codeKind = 'text';
    return m;
  });
  return ex;
}

  ex.meta.showPoints = false;
  const B = (title, text, distract, seed) => Object.assign(newSection('blank'), { title, text, distract, seed });

そういった機器にはコンピュータが内蔵されており、そのコンピュータはディスプレイやマウスのような{{ハードウェア}}と、ゲームや動画再生アプリのような{{ソフトウェア}}に分類されていました。
{{@ハードウェア}}には、マウスや{{キーボード}}のような入力機能をもつ機器や、ディスプレイや{{スピーカ}}のような出力機能をもつ機器があります。また、その入出力される情報を計算する、CPUのような{{演算}}機能もありました。

    'メインメモリ\nHDD\n記憶', 101);
  const s2 = B('情報のデジタル化',

/* コードの欄：書いたとおりの行(空行・字下げもそのまま。タブは空白4つ)。中身が空なら出さない */
function codeOf(s, tokLine) {   // ブロックの欄も同じ行の形にしてから、compile で木にする(blockTree)
  if (s.code == null || !s.code.trim()) return null;
  const lines = s.code.replace(/\t/g, '    ').replace(/\s+$/, '').split(/\r?\n/).map(l => l.replace(/\s+$/, ''));
  while (lines.length && !lines[0].trim()) lines.shift();
  return { lines: lines.map(tokLine), ln: !!s.codeLines };
}

/* =====================================================================
   ブロックの欄(MakeCode のようなビジュアルプログラミング)
   書き方：1行1ブロック。字下げ(空白)= 上のブロックの中。形は並び方で決める(言葉の辞書は持たない)。
     字下げなしで中身あり = イベント(上が丸い・太い枠)、字下げありで中身あり = コの字、
     「もし…なら」と同じ字下げの「でなければ…」= コの字を2段に、それ以外 = ふつうのブロック。
     (100) = 値の枠(丸)、<…> = 条件の枠(六角形)、{{答え}} = 空欄、[漢字|かな] = ルビ。
   白黒印刷が前提なので、白地＋黒い線だけで描き、形と線の太さで区別する(灰色の塗りは使わない)。
   画面・印刷はこの SVG をそのまま、Word は同じ絵を canvas で描いた PNG にして入れる。
   ===================================================================== */
/* 行(空欄の処理まで済んだもの)→ ブロックの木。node = { arms: [{ segs, kids }] }(arms が2つ以上 = でなければ付き) */
function blockTree(lines) {
  const root = { arms: [{ kids: [] }] }, stack = [{ ind: -1, arm: root.arms[0] }];
  lines.forEach(toks => {
    const first = toks[0] && toks[0].t === 'text' ? toks[0].v : '';
    const ind = first.length - first.trimStart().length;
    const tk = toks.map((t, i) => i === 0 && t.t === 'text' ? { ...t, v: t.v.trimStart() } : t).filter(t => t.t !== 'text' || t.v);
    if (!tk.length) return;
    while (stack.length > 1 && stack[stack.length - 1].ind >= ind) stack.pop();
    const sibs = stack[stack.length - 1].arm.kids, prev = sibs[sibs.length - 1];
    const head = tk[0].t === 'text' ? plain(tk[0].v).trim() : '';
    if (/^でなければ/.test(head) && prev && prev.arms[0].kids.length) {   // 前の「もし」の2段目にする
      const arm = { segs: slotParse(tk), kids: [] }; prev.arms.push(arm); stack.push({ ind, arm }); return;
    }
    const node = { arms: [{ segs: slotParse(tk), kids: [] }] };
    sibs.push(node); stack.push({ ind, arm: node.arms[0] });
  });
  return root.arms[0].kids;
}
/* 行の中の ( ) と < > を枠にする。対応する閉じ記号がないものは、ただの文字のまま */
function slotParse(toks) {
  const items = [];
  toks.forEach(t => t.t === 'text' ? items.push(...t.v) : items.push(t));
  const match = new Map(), st = [];
  items.forEach((c, i) => {
    if (c === '(' || c === '<') st.push(i);
    else if ((c === ')' || c === '>') && st.length && (items[st[st.length - 1]] === '(') === (c === ')')) match.set(st.pop(), i);
  });
  const trim = a => { if (a[0] && a[0].t === 'text') a[0].v = a[0].v.trimStart(); const l = a[a.length - 1]; if (l && l.t === 'text') l.v = l.v.trimEnd(); return a.filter(x => x.t !== 'text' || x.v); };
  const build = (a, b) => {
    const out = []; let buf = '';
    const flush = () => { if (buf) { out.push({ t: 'text', v: buf }); buf = ''; } };
    for (let i = a; i < b; i++) {
      const c = items[i];
      if (typeof c !== 'string') { flush(); out.push(c); continue; }
      if (match.has(i)) { flush(); out.push({ t: 'slot', kind: c === '(' ? 'num' : 'bool', kids: trim(build(i + 1, match.get(i))) }); i = match.get(i); continue; }
      buf += c;
    }
    flush(); return out;
  };
  return trim(build(0, items.length));
}
const MEAS = document.createElement('canvas').getContext('2d');   // 字の幅を測る
/* ブロックの木 → SVG の文字列。字の大きさは用紙の字と同じ(m.size pt) */
function blocksSVG(cd, m) {
  const F = m.size * 4 / 3, ff = fontCss(m.font), rb = RUBY;
  const tw = (s, sz = F, b) => { MEAS.font = `${b ? 'bold ' : ''}${sz}px ${ff}`; return MEAS.measureText(s).width; };
  const SH = F * 1.45 + (rb ? F * 0.5 : 0);        // 値の枠・空欄の高さ
  const RH = SH + F * 0.75;                        // ブロック1段の高さ
  const PX = F * 0.6, ARM = F * 1.4, BOT = F * 0.9, GAP = F * 0.3, HAT = F * 0.8, M = 3;
  // out = SVG(画面・印刷用)、ops = 同じ絵を canvas に描くための手順(Word 用の PNG。blocksPng)
  const out = [], ops = [], n1 = v => v.toFixed(1);
  const T = (x, y, s, sz = F, b) => { out.push(`<text x="${n1(x)}" y="${n1(y)}" font-size="${n1(sz)}"${b ? ' font-weight="bold"' : ''}>${X(s)}</text>`); ops.push({ t: 'text', x, y, s, sz, b }); };
  const RC = (x, y, w, h, rx, sw) => { out.push(`<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}"${rx ? ` rx="${n1(rx)}"` : ''} fill="#fff" stroke="#000" stroke-width="${sw}"/>`); ops.push({ t: 'rect', x, y, w, h, rx, sw }); };
  const PA = (d, sw) => { out.push(`<path d="${d}" fill="#fff" stroke="#000" stroke-width="${sw}" stroke-linejoin="round"/>`); ops.push({ t: 'path', d, sw }); };
  const segsOf = v => rb ? rubySegs(v) : [{ t: plain(v), r: null }];
  const textW = v => segsOf(v).reduce((a, g) => a + Math.max(tw(g.t), g.r ? tw(g.r, F * 0.5) : 0), 0);
  const base = cy => cy + F * 0.36 + (rb ? F * 0.22 : 0);
  const blankLab = sg => `（${sg.n == null ? '？' : sg.n}）`;
  const slotH = d => SH - d * F * 0.3;
  const segW = (sg, d) => {
    if (sg.t === 'text') return textW(sg.v);
    if (sg.t === 'blank') return tw(blankLab(sg), F, true) + F * 0.4 + F * 0.2;
    const h = slotH(d), pad = sg.kind === 'num' ? F * 0.5 : h / 2 + F * 0.2;
    return Math.max(sg.kids.reduce((a, k) => a + segW(k, d + 1), 0) + pad * 2, F * 1.6) + F * 0.2;
  };
  const drawSeg = (sg, x, cy, d) => {
    if (sg.t === 'text') {
      segsOf(sg.v).forEach(g => {
        const bw = tw(g.t), rw = g.r ? tw(g.r, F * 0.5) : 0, w = Math.max(bw, rw);
        T(x + (w - bw) / 2, base(cy), g.t); if (g.r) T(x + (w - rw) / 2, base(cy) - F * 1.0, g.r, F * 0.5);
        x += w;
      });
      return;
    }
    const w = segW(sg, d) - F * 0.2, x0 = x + F * 0.1;
    if (sg.t === 'blank') {
      const bh = slotH(d) - F * 0.1;
      RC(x0, cy - bh / 2, w, bh, 0, 1.8);
      const lw = tw(blankLab(sg), F, true); T(x0 + (w - lw) / 2, cy + F * 0.36, blankLab(sg), F, true);
      return;
    }
    const h = slotH(d), pad = sg.kind === 'num' ? F * 0.5 : h / 2 + F * 0.2, t = cy - h / 2;
    if (sg.kind === 'num') RC(x0, t, w, h, h / 2, 1.1);
    else PA(`M${n1(x0)},${n1(cy)} L${n1(x0 + h / 2)},${n1(t)} H${n1(x0 + w - h / 2)} L${n1(x0 + w)},${n1(cy)} L${n1(x0 + w - h / 2)},${n1(t + h)} H${n1(x0 + h / 2)} Z`, 1.1);
    const inner = sg.kids.reduce((a, k) => a + segW(k, d + 1), 0);
    let kx = x0 + Math.max(pad, (w - inner) / 2);
    sg.kids.forEach(k => { drawSeg(k, kx, cy, d + 1); kx += segW(k, d + 1); });
  };
  const rowW = segs => PX * 2 + segs.reduce((a, s) => a + segW(s, 0), 0);
  const drawRow = (segs, x, y) => { let sx = x + PX; segs.forEach(s => { drawSeg(s, sx, y + RH / 2, 0); sx += segW(s, 0); }); };
  const lay = (node, top) => {
    const isC = node.arms.length > 1 || node.arms[0].kids.length > 0;
    if (!isC) {
      const w = Math.max(rowW(node.arms[0].segs), F * 3);
      return { w, h: RH, draw: (x, y) => {
        RC(x, y, w, RH, F * 0.25, 1.4);
        drawRow(node.arms[0].segs, x, y);
      } };
    }
    const hat = top ? HAT : 0;
    const arms = node.arms.map(a => {
      const kids = a.kids.map(k => lay(k, false));
      const bh = kids.length ? kids.reduce((s, k) => s + k.h, 0) + GAP * (kids.length + 1) : F * 1.1;
      return { a, kids, bh, hw: rowW(a.segs) };
    });
    const w = Math.max(F * 6, ...arms.map(r => r.hw), ...arms.map(r => ARM + Math.max(0, ...r.kids.map(k => k.w)) + F * 0.6));
    const h = hat + arms.reduce((s, r) => s + RH + r.bh, 0) + BOT;
    return { w, h, draw: (x, y) => {
      // 外形：イベントは上が丸く(帽子の形)、太い枠。コの字は、中身の左に腕を残してくり抜く
      let d = top ? `M${n1(x)},${n1(y + hat)} Q${n1(x + F * 2.2)},${n1(y - hat * 0.9)} ${n1(x + F * 4.6)},${n1(y + hat)} H${n1(x + w)}` : `M${n1(x)},${n1(y)} H${n1(x + w)}`;
      let cy = y + hat;
      arms.forEach(r => { d += ` V${n1(cy + RH)} H${n1(x + ARM)} V${n1(cy + RH + r.bh)} H${n1(x + w)}`; cy += RH + r.bh; });
      d += ` V${n1(cy + BOT)} H${n1(x)} Z`;
      PA(d, top ? 2.4 : 1.4);
      cy = y + hat;
      arms.forEach(r => {
        drawRow(r.a.segs, x, cy);
        let ky = cy + RH + GAP;
        r.kids.forEach(k => { k.draw(x + ARM, ky); ky += k.h + GAP; });
        cy += RH + r.bh;
      });
    } };
  };
  const tops = cd.tree.map(nd => lay(nd, nd.arms.length > 1 || nd.arms[0].kids.length > 0));
  const W = Math.ceil(Math.max(F * 4, ...tops.map(t => t.w)) + M * 2 + 2);
  let y = M + 2;
  tops.forEach(t => { t.draw(M, y); y += t.h + F * 0.8; });
  const H = Math.ceil(y - F * 0.8 + M);
  return { w: W, h: H, ops, ff, svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${X(ff.replace(/"/g, "'"))}"><rect width="${W}" height="${H}" fill="#fff"/>${out.join('')}</svg>` };
}
function blocksHTML(cd, m) {   // 画面・印刷：大きさ(%)は表示の幅で変える。用紙より広ければ CSS で縮む
  const b = blocksSVG(cd, m);
  return `<div class="blocks">${b.svg.replace('<svg ', `<svg style="width:${Math.round(b.w * cd.scale / 100)}px" `)}</div>`;
}
/* ブロックの絵 → PNG(Word 用)。k 倍の細かさで canvas に直接描く。
   SVG を画像として読み込むより、字の幅を測ったのと同じ canvas・同じ字体で描く方が確実なため */
async function blocksPng(cd, m, k) {
  const b = blocksSVG(cd, m), cv = document.createElement('canvas');
  cv.width = Math.round(b.w * k); cv.height = Math.round(b.h * k);
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  g.scale(k, k); g.lineJoin = 'round'; g.strokeStyle = '#000';
  b.ops.forEach(o => {
    if (o.t === 'text') { g.font = `${o.b ? 'bold ' : ''}${o.sz}px ${b.ff}`; g.fillStyle = '#000'; g.fillText(o.s, o.x, o.y); return; }
    let p; if (o.t === 'path') p = new Path2D(o.d); else { p = new Path2D(); if (o.rx) p.roundRect(o.x, o.y, o.w, o.h, o.rx); else p.rect(o.x, o.y, o.w, o.h); }
    g.fillStyle = '#fff'; g.fill(p); g.lineWidth = o.sw; g.stroke(p);
  });

  return { bytes: new Uint8Array(await blob.arrayBuffer()), ext: 'png', w: cv.width, h: cv.height, cssW: b.w };
}

/* =====================================================================
   3. compile  ★中心：入力データ → 番号・記号・正答・警告
      出力(HTML/Word/CSV)は、すべてこの結果だけを見て作る。
   ===================================================================== */
function compile(exam) {
  const m = exam.meta;
  const L = LABEL_SETS[m.labelSet] || LABEL_SETS.kana;
  const maxC = num(m.maxChoices, 0);
  const C = { meta: m, labels: L, sections: [], answers: [], written: [], warnings: [], itemNo: {}, figNo: {}, total: 0 };
  const W = (si, msg) => C.warnings.push({ sec: si + 1, msg });
  let n = 0, wn = 0;

  // 図の番号：テスト全体の通し番号で、用紙に出る順(上から)。大問の図が「本文の下」なら設問の図が先。
  // 先に数えておき、本文の〔図:見出し〕を「図３」に置き換える
  const capNo = {}, figNo = {}; let fc = 0;
  exam.sections.forEach((s, si) => {
    const secF = s.figures || [], itemF = (s.items || []).flatMap(it => it.figures || []);
    (s.figPos === 'below' ? [...itemF, ...secF] : [...secF, ...itemF]).forEach(f => {
      figNo[f.id] = ++fc; const cap = plain(f.caption || '').trim(); if (!cap) return;
      if (capNo[cap]) W(si, `図の見出し「${cap}」が2つあります。〔図:${cap}〕は前の方の図を指します`); else capNo[cap] = fc;
    });
  });
  C.figs = []; C.cimgs = [];   // cimgs = 選択肢の画像(Word 用に集める)
  const mkFigs = (list, si) => (list || []).map(f => {
    const no = figNo[f.id]; C.figNo[f.id] = no;
    const ok = !!getImg(f.img);
    if (!ok) W(si, `図${no}の画像が見つかりません（画像の入っていないファイルから読み込んだ可能性があります。図を入れ直してください）`);
    const o = { no, img: f.img, caption: (f.caption || '').trim(), width: Math.min(100, Math.max(10, num(f.width, 50))), gray: !!f.gray, ok };
    C.figs.push(o); return o;
  });
  const itemFigs = (it, si) => ({ figs: mkFigs(it.figures, si), figPos: ITEM_FIG_POS[it.figPos] ? it.figPos : 'below' });
  const fr = (str, si) => String(str || '').replace(FIG_REF_RE, (_, k) => {
    k = plain(k).trim(); const no = capNo[k];
    if (!no) { W(si, `〔図:${k}〕の図がありません（図の見出しと同じ言葉にしてください）`); return '図？'; }
    return '図' + zen(no);
  });

  exam.sections.forEach((s, si) => {
    const sec = { no: si + 1, id: s.id, type: s.type, title: (s.title || '').trim(), lead: fr(s.lead, si).trim(), notes: [], points: num(s.points, 0) };
    if (!sec.title) W(si, '見出しが空です');
    sec.figPos = FIG_POS[s.figPos] ? s.figPos : 'above';
    sec.code = null; sec.codePos = CODE_POS[s.codePos] ? s.codePos : 'before';
    sec.figs = mkFigs(s.figures, si);

    if (s.type === 'blank') {
      const raw = fr(s.text, si).replace(/｛/g, '{').replace(/｝/g, '}');
      const blanks = [], last = {};
      const tokLine = line => {
        const toks = []; let pos = 0, mt; const re = /\{\{\s*(@?)([^{}]*?)\s*\}\}/g;
        while ((mt = re.exec(line))) {
          if (mt.index > pos) toks.push({ t: 'text', v: line.slice(pos, mt.index) });
          const ref = mt[1] === '@', term = mt[2].trim();
          if (!term) W(si, '空欄 {{ }} の中身が空です');
          else if (ref) {
            if (last[term] == null) { W(si, `{{@${term}}} は、先に「${term}」の空欄がないため番号を決められません`); toks.push({ t: 'blank', n: null, term }); }
            else toks.push({ t: 'blank', n: last[term], term, ref: true });
          } else { n++; last[term] = n; blanks.push({ n, term }); toks.push({ t: 'blank', n, term }); }
          pos = re.lastIndex;
        }
        if (pos < line.length) toks.push({ t: 'text', v: line.slice(pos) });
        if (/\{\{|\}\}/.test(toks.filter(t => t.t === 'text').map(t => t.v).join(''))) W(si, '空欄の括弧 {{ }} が正しく閉じていない行があります');
        return toks;
      };
      // 番号は上から順に付ける：コードの欄が「本文の前」ならコードが先
      const codeFirst = s.code != null && s.codePos === 'before';
      if (codeFirst) sec.code = codeOf(s, tokLine);
      sec.paras = raw.split(/\r?\n/).filter(l => l.trim()).map(tokLine);
      if (!codeFirst) sec.code = codeOf(s, tokLine);
      if (!blanks.length) W(si, '空欄がありません（{{語句}} で囲んで空欄にします）');
      const uniq = []; blanks.forEach(b => { if (!uniq.includes(b.term)) uniq.push(b.term); });
      const dis = (s.distract || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      dis.forEach(d => { if (uniq.includes(d)) W(si, `ダミー「${d}」は正解としても使われています`); });
      let all = [...uniq]; dis.forEach(d => { if (!all.includes(d)) all.push(d); });
      if (s.order === 'shuffle') { const sd = (s.seed | 0) + ':'; all.sort((a, b) => hash32(sd + a) - hash32(sd + b)); }
      else if (s.order === 'manual') {
        const man = [...new Set((s.manual || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean))];
        uniq.forEach(t => { if (!man.includes(t)) { man.push(t); W(si, `手動の語群に「${t}」がないため末尾に追加しました`); } });
        all = man;
      }
      if (all.length > L.length) W(si, `語群が${all.length}個あり、記号が足りません（最大${L.length}個）`);
      else if (maxC && all.length > maxC) W(si, `語群が${all.length}個で、マークシートの最大選択肢数(${maxC})を超えています`);
      const items = all.map((t, i) => ({ label: L[i] || '？', text: t, isAnswer: uniq.includes(t) }));
      blanks.forEach(b => { const idx = all.indexOf(b.term); C.answers.push({ no: b.n, label: L[idx] || '？', text: b.term, points: sec.points, sec: sec.no }); });
      let cols = num(m.bankCols, 0);
      if (!cols) { const mx = Math.max(0, ...all.map(vlen)); cols = mx <= 4 ? 5 : mx <= 7 ? 4 : mx <= 11 ? 3 : 2; }
      if (m.showRuby && !num(m.bankCols, 0)) cols = Math.max(2, cols - 1);   // ルビ付きは幅をとるので1段階ゆるめる
      sec.bank = { items, cols, note: (s.bankNote || '').trim() };
      sec.blankMap = blanks.map(b => ({ n: b.n, label: L[all.indexOf(b.term)] || '？', term: b.term }));
    }

    else if (s.type === 'choice') {
      sec.items = (s.items || []).map(it => {
        n++; C.itemNo[it.id] = n;
        const keep = []; let corr = -1;
        (it.choices || []).forEach((c, i) => {
          const t = fr(c.text, si).trim();
          if (t || c.img) { if (i === it.correct) corr = keep.length; keep.push({ text: t, img: c.img || null }); }
        });
        if (!String(it.text || '').trim()) W(si, `（${n}）の問題文が空です`);
        if (keep.length < 2) W(si, `（${n}）の選択肢が2つ未満です`);
        if (keep.length > L.length) W(si, `（${n}）の選択肢が多すぎます`);
        else if (maxC && keep.length > maxC) W(si, `（${n}）の選択肢数がマークシートの最大(${maxC})を超えています`);
        if (corr < 0) W(si, `（${n}）の正解が選ばれていません（空の選択肢が正解になっていないか確認）`);
        // 図だけの選択肢は、正答の文字を「（図）」として渡す(採点アプリは表示に使うだけ)
        else C.answers.push({ no: n, label: L[corr], text: keep[corr].text || '（図）', points: sec.points, sec: sec.no });
        const imgMode = keep.some(c => c.img);
        let cols;
        if (imgMode) {   // 図の選択肢：自動なら4つまで2×2、6つまで3列、それより多いと4列
          cols = it.choiceCols === 'auto' || !CHOICE_COLS[it.choiceCols] ? (keep.length <= 4 ? 2 : keep.length <= 6 ? 3 : 4) : Number(it.choiceCols);
          keep.forEach((c, i) => { if (c.img) { c.ok = !!getImg(c.img); if (!c.ok) W(si, `（${n}）の選択肢「${L[i]}」の画像が見つかりません`); else C.cimgs.push({ img: c.img, gray: false, ok: true }); } });
        } else {
          const vmax = Math.max(0, ...keep.map(c => vlen(c.text)));
          cols = (vmax <= 6 && keep.length <= 5) ? keep.length : (vmax <= 15 ? 2 : 1);
        }
        return { id: it.id, n, text: fr(it.text, si).trim(), ...itemFigs(it, si), cols: Math.max(1, cols), imgMode,
          choiceH: Math.min(80, Math.max(10, num(it.choiceH, 30))), choices: keep.map((c, i) => ({ label: L[i] || '？', ...c })) };
      });
    }

    else if (s.type === 'tf') {
      const tl = (s.trueLabel || '正しい').trim(), fl = (s.falseLabel || '間違っている').trim();
      sec.notes = [`${tl}と考える場合は、マークシートの「${L[0]}」を塗りつぶしなさい。`, `${fl}と考える場合は、マークシートの「${L[1]}」を塗りつぶしなさい。`];
      sec.items = (s.items || []).map(it => {
        n++; C.itemNo[it.id] = n;
        const c = it.correct ? 1 : 0;
        if (!String(it.text || '').trim()) W(si, `（${n}）の文が空です`);
        C.answers.push({ no: n, label: L[c], text: c ? fl : tl, points: sec.points, sec: sec.no });
        return { id: it.id, n, text: fr(it.text, si).trim(), ...itemFigs(it, si) };
      });
    }

    else if (s.type === 'written') {
      sec.items = (s.items || []).map(it => {
        wn++; C.itemNo[it.id] = '記' + wn;
        if (!String(it.text || '').trim()) W(si, `記述${wn}の問題文が空です`);
        const o = { id: it.id, k: wn, text: fr(it.text, si).trim(), ...itemFigs(it, si), answer: (it.answer || '').trim(), lines: Math.max(1, Math.round(num(it.lines, 3))), points: num(it.points, 0) };
        C.written.push({ ...o, sec: sec.no });
        return o;
      });
    }
    if (s.type !== 'blank') {   // 語群のない大問では、コードの {{ }} は空欄にせず、そのまま出す
      sec.code = codeOf(s, line => [{ t: 'text', v: line }]);
      if (sec.code && /\{\{/.test(s.code)) W(si, 'コードの欄の {{ }} は、語群選択の大問でだけ空欄になります（この大問ではそのまま表示します）');
    }
    if (sec.code && s.codeKind === 'blocks') {
      Object.assign(sec.code, { kind: 'blocks', tree: blockTree(sec.code.lines), scale: Math.min(200, Math.max(30, num(s.blockScale, 100))), key: 'blocks:' + s.id });
      if (!sec.code.tree.length) sec.code = null;
    }
    C.sections.push(sec);
  });
  C.total = C.answers.reduce((a, b) => a + b.points, 0) + C.written.reduce((a, b) => a + b.points, 0);
  return C;
}

/* =====================================================================
   4a. 出力：画面・印刷用HTML
   ===================================================================== */
function fontCss(name) { return (FONTS.find(f => f[0] === name) || FONTS[0])[1]; }
/* 図：見出しは図の下に「図３　回路図」。side=true は「本文の右」の列の中(幅は列いっぱい) */
function figHTML(f, side) {
  const im = f.ok ? `<img src="${imgURL(f.img)}" alt=""${f.gray ? ' class="gray"' : ''}>` : `<div class="fig-miss">（図${zen(f.no)}の画像がありません）</div>`;
  return `<figure class="fig"${side ? '' : ` style="width:calc(${f.width}% - 3mm)"`}>${im}<figcaption>図${zen(f.no)}${f.caption ? '　' + escR(f.caption) : ''}</figcaption></figure>`;
}
/* コードの欄：等幅の字・書いたとおりの字下げ・枠囲み・ルビなし */
function codeHTML(cd) {
  const w = String(cd.lines.length).length;
  return '<div class="code">' + cd.lines.map((toks, i) =>
    `<div class="cl">${cd.ln ? `<span class="ln">${String(i + 1).padStart(w, ' ')}</span>` : ''}<span class="ct">${toks.map(t => t.t === 'text' ? esc(t.v) : blankHTML(t)).join('') || ' '}</span></div>`).join('') + '</div>';
}
/* 図の選択肢：同じ高さの枠に図を入れてそろえる(縦長・横長がまざっても列がずれない)。記号は左上、文字は図の下 */
function choiceImgsHTML(it) {
  return `<div class="q-ci" style="grid-template-columns:repeat(${it.cols},1fr)">` + it.choices.map(c =>
    `<div class="ci"><span class="lab">${escR(c.label)}</span><div class="ci-box" style="height:${it.choiceH}mm">` +
    (c.img ? (c.ok ? `<img src="${imgURL(c.img)}" alt="">` : '<span class="fig-miss">（画像がありません）</span>') : escR(c.text)) + '</div>' +   // 図のない選択肢は、文字を枠の中に
    (c.img && c.text ? `<div class="ci-t">${escR(c.text)}</div>` : '') + '</div>').join('') + '</div>';
}
/* 設問1つ：q = 問題文、rest = 選択肢・解答欄。図は問題文の下(選択肢の上)か、右 */
function qWrap(it, q, rest) {
  const F = it.figs;
  if (!F.length) return `<div class="q">${q}${rest}</div>`;
  if (it.figPos === 'below') return `<div class="q">${q}${figsHTML(F)}${rest}</div>`;
  const w = Math.min(60, Math.max(20, ...F.map(f => f.width)));
  return `<div class="q"><div class="figrow"><div class="figside" style="width:${w}%">${F.map(f => figHTML(f, true)).join('')}</div><div class="figmain">${q}${rest}</div></div></div>`;
}
const figsHTML = F => `<div class="figs">${F.map(f => figHTML(f)).join('')}</div>`;
const blankHTML = t => `<span class="blank">（${t.n == null ? '？' : t.n}）</span>`;

function headingHTML(sec, m) {
  let pt = '';
  if (m.showPoints && sec.type !== 'written' && sec.points) pt = `<small>（各${sec.points}点）</small>`;
  return `<h2><span class="no">${zen(sec.no)}</span><span>${escR(sec.title)}</span>${pt}</h2>`;
}

function renderPaperHTML(C, force) {
  const m = C.meta; RUBY = !!(force || m.showRuby); AUTO = RUBY && !!(force || m.autoRuby); let h = '';
  if (m.date.trim()) h += `<div class="p-date">${escR(m.date)}</div>`;
  h += `<div class="p-title">${escR(m.title)}</div><div class="p-kind">${escR(m.kind)}</div>`;
  if (m.showName) h += `<div class="p-name"><span class="ln"></span>年<span class="ln"></span>組<span class="ln"></span>番　名前<span class="ln w"></span></div>`;
  const nl = m.notice.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  if (nl.length) h += `<div class="p-notice">${nl.map(x => `<div>※　${escR(x)}</div>`).join('')}</div>`;
  if (m.intro.trim()) h += `<p class="p-intro">${escR(m.intro.trim())}</p>`;

  C.sections.forEach(sec => {
    h += `<section class="sec${m.pageMode === 'section' && sec.no > 1 ? ' pb' : ''}${m.pageMode === 'keep' ? ' keep' : ''}">${headingHTML(sec, m)}`;
    if (sec.lead) h += `<p class="lead">${escR(sec.lead)}</p>`;
    sec.notes.forEach(x => h += `<p class="note">※　${escR(x)}</p>`);

    let main = '', after = '';     // main = 本文(段落・設問)、after = 語群。図は main の上・下・右に置く
    if (sec.type === 'blank') {
      sec.paras.forEach((toks, i) => {
        main += `<p class="para${m.keepBank && i === sec.paras.length - 1 ? ' last' : ''}">` +
          toks.map(t => t.t === 'text' ? escR(t.v) : blankHTML(t)).join('') + '</p>';
      });
      const b = sec.bank;
      after += `<div class="bank"><div class="bank-h"><b>語群</b>${b.note ? `<span>${escR(b.note)}</span>` : ''}</div>` +
        `<div class="bank-g" style="grid-template-columns:repeat(${b.cols},1fr)">` +
        b.items.map(it => `<div><span class="lab">${escR(it.label)}</span>${escR(it.text)}</div>`).join('') + '</div></div>';
    }
    else if (sec.type === 'choice') {
      sec.items.forEach(it => {
        main += qWrap(it, `<div class="q-t"><span class="qn">（${it.n}）</span>${escR(it.text)}</div>`,
          it.imgMode ? choiceImgsHTML(it) :
          `<div class="q-c" style="grid-template-columns:repeat(${it.cols},auto)">` +
          it.choices.map(c => `<div><span class="lab">${escR(c.label)}</span>${escR(c.text)}</div>`).join('') + '</div>');
      });
    }
    else if (sec.type === 'tf') {
      sec.items.forEach(it => main += qWrap(it, `<div class="q-t"><span class="qn">（${it.n}）</span>${escR(it.text)}</div>`, ''));
    }
    else if (sec.type === 'written') {
      sec.items.forEach(it => {
        const pt = m.showPoints && it.points ? `<span class="pt">（${it.points}点）</span>` : '';
        main += qWrap(it, `<div class="q-t"><span class="qn">（記${it.k}）</span>${escR(it.text)}${pt}</div>`,
          `<div class="ansbox" style="height:${it.lines * 9}mm"></div>`);
      });
    }
    if (sec.code) { const ch = sec.code.kind === 'blocks' ? blocksHTML(sec.code, m) : codeHTML(sec.code); main = sec.codePos === 'before' ? ch + main : main + ch; }
    const F = sec.figs;
    if (!F.length) h += main + after;
    else if (sec.figPos === 'above') h += figsHTML(F) + main + after;
    else if (sec.figPos === 'below') h += main + figsHTML(F) + after;
    else {   // 右：左に本文、右に図を縦に並べる。右の列の幅は、いちばん大きい図の幅(%)
      const w = Math.min(60, Math.max(20, ...F.map(f => f.width)));
      h += `<div class="figrow"><div class="figside" style="width:${w}%">${F.map(f => figHTML(f, true)).join('')}</div><div class="figmain">${main}</div></div>` + after;
    }
    h += '</section>';
  });
  return h;
}

function renderKeyHTML(C) {
  const m = C.meta; let h = `<div class="k-title">正答一覧</div><div class="k-sub">${escP(m.title)}　（マークシート ${C.answers.length}問 ／ 記述 ${C.written.length}問 ／ 合計 ${C.total}点）</div>`;
  C.sections.forEach(sec => {
    const rows = C.answers.filter(a => a.sec === sec.no);
    const wr = C.written.filter(a => a.sec === sec.no);
    h += `<div class="k-sec"><h2>${zen(sec.no)}　${escP(sec.title)}</h2><div class="k-grid">`;
    rows.forEach(a => h += `<div class="k-row"><span class="n">${a.no}</span><span class="a">${escP(a.label)}</span><span class="t">${escP(a.text)}</span><span class="p">${a.points}点</span></div>`);
    wr.forEach(a => h += `<div class="k-row"><span class="n">記${a.k}</span><span class="t">${escP(a.answer || '（模範解答なし）')}</span><span class="p">${a.points}点</span></div>`);
    h += '</div></div>';
  });
  return h;
}

/* =====================================================================
   4b. 出力：正答CSV（採点アプリ取り込み用の素材。列は必要に応じて調整）
   ===================================================================== */
function buildCSV(C) {
  const q = v => /[",\r\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const rows = [['番号', '正答記号', '正答の位置(1始まり)', '正答の語句', '配点', '大問']];
  C.answers.forEach(a => rows.push([a.no, a.label, C.labels.indexOf(a.label) + 1, plain(a.text), a.points, a.sec]));
  C.written.forEach(a => rows.push(['記' + a.k, '', '', plain(a.answer), a.points, a.sec]));
  return '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n') + '\r\n';
}

/* =====================================================================
   4b2. 出力：採点アプリ連携用JSON（★2つのアプリの約束事。形を変えるときは schema を上げる）
   ===================================================================== */
function buildKeyJSON(C, ex) {
  const secs = C.sections.map(sec => {
    const a = C.answers.filter(x => x.sec === sec.no);
    return { no: sec.no, title: plain(sec.title), type: sec.type, from: a.length ? a[0].no : null, to: a.length ? a[a.length - 1].no : null,
             points: a.reduce((t, x) => t + x.points, 0) + C.written.filter(w => w.sec === sec.no).reduce((t, x) => t + x.points, 0) };
  });
  return {
    app: 'testmaker-answerkey', schema: 1, exportedAt: new Date().toISOString(),
    exam: { id: ex.id, name: ex.name, title: C.meta.title, date: C.meta.date },
    labels: C.labels.slice(0, Math.max(num(C.meta.maxChoices, 10), 1)), total: C.total,
    items: C.answers.map(a => ({ no: a.no, section: a.sec, label: a.label, index: C.labels.indexOf(a.label) + 1, text: plain(a.text), points: a.points })),
    written: C.written.map(w => ({ id: '記' + w.k, section: w.sec, answer: plain(w.answer), points: w.points, lines: w.lines })),
    sections: secs
  };
}

/* =====================================================================
   4c. 出力：Word(.docx)  ※外部ライブラリなし。XMLとZIPを自前で組み立てる
   ===================================================================== */
const X = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let BOLD_FONT = null;
function R(t, o = {}) {           // run
  let r = '';
  // hint="default"：" や ' を日本語の字形(全角の “ ”)にしない(既定は eastAsia。コードの欄で困るため)
  if (o.font) r += `<w:rFonts w:ascii="${X(o.font)}" w:hAnsi="${X(o.font)}" w:eastAsia="${X(o.font)}" w:cs="${X(o.font)}" w:hint="default"/>`;
  else if (o.b && BOLD_FONT) r += `<w:rFonts w:ascii="${X(BOLD_FONT)}" w:hAnsi="${X(BOLD_FONT)}" w:eastAsia="${X(BOLD_FONT)}" w:cs="${X(BOLD_FONT)}"/>`;
  if (o.b) r += '<w:b/><w:bCs/>';
  if (o.color) r += `<w:color w:val="${o.color}"/>`;
  if (o.spacing) r += `<w:spacing w:val="${o.spacing}"/>`;
  if (o.sz) r += `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`;
  if (o.u) r += '<w:u w:val="single"/>';
  if (o.bdr) r += '<w:bdr w:val="single" w:sz="4" w:space="0" w:color="000000"/>';
  if (o.shd) r += `<w:shd w:val="clear" w:color="auto" w:fill="${o.shd}"/>`;
  return `<w:r>${r ? `<w:rPr>${r}</w:rPr>` : ''}<w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
}
let BASE_SZ = 22, LSK = 1;   // LSK = 行間の倍率(lsOf)
function RR(t, o = {}) {                // ルビ対応の run 群
  if (!RUBY) return R(plain(t), o);
  const base = o.sz || BASE_SZ, rs = Math.max(9, Math.round(base * 0.55));
  return rubySegs(t).map(g => !g.r ? R(g.t, o) :
    `<w:r><w:ruby><w:rubyPr><w:rubyAlign w:val="distributeSpace"/><w:hps w:val="${rs}"/><w:hpsRaise w:val="${base}"/><w:hpsBaseText w:val="${base}"/><w:lid w:val="ja-JP"/></w:rubyPr><w:rt>${R(g.r, { ...o, sz: rs, b: false })}</w:rt><w:rubyBase>${R(g.t, o)}</w:rubyBase></w:ruby></w:r>`).join('');
}
const TAB = '<w:r><w:tab/></w:r>';
function P(runs, o = {}) {        // paragraph
  let p = '';
  if (o.keepNext) p += '<w:keepNext/>';
  if (o.keepLines) p += '<w:keepLines/>';
  if (o.pbb) p += '<w:pageBreakBefore/>';
  if (o.box) p += '<w:pBdr><w:top w:val="single" w:sz="12" w:space="3" w:color="000000"/><w:left w:val="single" w:sz="12" w:space="6" w:color="000000"/><w:bottom w:val="single" w:sz="12" w:space="3" w:color="000000"/><w:right w:val="single" w:sz="12" w:space="6" w:color="000000"/></w:pBdr>';
  if (o.underline) p += '<w:pBdr><w:bottom w:val="single" w:sz="16" w:space="2" w:color="000000"/></w:pBdr>';
  if (o.tabs) p += `<w:tabs>${o.tabs}</w:tabs>`;

/* ---- 最小のZIP書き出し（無圧縮）---- */
let _crcT = null;
function crc32(u8) {
  if (!_crcT) { _crcT = new Uint32Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; _crcT[i] = c >>> 0; } }
  let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = _crcT[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files, mime) {
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const d = new Date(), dt = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dd = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  files.forEach(f => {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nm, f.data);
    const ce = new DataView(new ArrayBuffer(46));
    ce.setUint32(0, 0x02014b50, true); ce.setUint16(4, 20, true); ce.setUint16(6, 20, true); ce.setUint16(8, 0x0800, true); ce.setUint16(10, 0, true);
    ce.setUint16(12, dt, true); ce.setUint16(14, dd, true); ce.setUint32(16, crc, true); ce.setUint32(20, sz, true); ce.setUint32(24, sz, true);
    ce.setUint16(28, nm.length, true); ce.setUint32(42, off, true);
    cen.push(new Uint8Array(ce.buffer), nm);
    off += 30 + nm.length + sz;
  });
  const cdSize = cen.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...cen, new Uint8Array(end.buffer)], { type: mime });
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* =====================================================================
   5. 保存(storage)・バックアップ・履歴
   ===================================================================== */
let store = null;           // { v, current, exams:[...], snaps:[...], images:{id:{data,w,h,type}}, lastBackupAt, lastChangeAt, lastSnapAt }
let saveFailed = false;
const cur = () => store.exams.find(e => e.id === store.current);

function loadStore() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.exams) && s.exams.length) { s.exams.forEach(migrate); s.snaps = s.snaps || []; s.userDict = s.userDict || {}; s.images = {}; if (!s.exams.find(e => e.id === s.current)) s.current = s.exams[0].id; return s; } } } catch (e) { console.warn(e); }
  const ex = sampleExam();
  return { v: 1, current: ex.id, exams: [ex], snaps: [], userDict: {}, images: {}, lastBackupAt: 0, lastChangeAt: 0, lastSnapAt: 0 };
}
/* localStorage(予備)に保存し、データファイルを使っていればそちらにも書く */
function saveStore() {
  clearTimeout(_saveT); _saveT = null;
  gcImages();
  if (imgsDirty) { imgsDirty = false; idbSet('images', store.images).catch(e => { console.warn(e); imgsDirty = true; }); }
  lsSave();
  DF.dirty = true; dfWrite();
  updateStatus();
}
// 画像は localStorage(約5MBまで)に入れず、IndexedDB(saveStore の中)に控える
function lsSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(store, (k, v) => k === 'images' ? undefined : v)); saveFailed = false; store.savedAt = Date.now(); }
  catch (e) { saveFailed = true; console.warn(e); }
}
let _saveT = null;
function saveSoon() { clearTimeout(_saveT); _saveT = setTimeout(saveStore, Object.keys(store.images).length ? 1500 : 500); }   // 画像があるとファイルが大きいので、書く回数を減らす
function snapshot(force, label) {
  const now = Date.now();
  if (!force && now - (store.lastSnapAt || 0) < 10 * 60 * 1000) return;
  const ex = cur(); if (!ex) return;
  store.snaps.unshift({ t: now, label: label || '自動', exam: clone(ex) });
  store.snaps = store.snaps.slice(0, 40); store.lastSnapAt = now;
}
function touch() {
  const ex = cur(); ex.updatedAt = Date.now(); store.lastChangeAt = ex.updatedAt;
  snapshot(false); saveSoon(); refreshSoon();
}

function exportBackup() {
  store.exams.forEach(e => e.schema = SCHEMA);
  const data = { app: 'testmaker', schema: SCHEMA, exportedAt: new Date().toISOString(), exams: store.exams, userDict: store.userDict, images: pickImages(usedImageIds(store.exams)) };
  download(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }), `テスト問題メーカー_バックアップ_${stamp()}.json`);
  store.lastBackupAt = Date.now(); saveStore(); toast('バックアップを保存しました（ダウンロードフォルダを確認。Googleドライブ等にも置いてください）');
}
function importBackup(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (d.userDict) Object.keys(d.userDict).forEach(k => { if (!(k in store.userDict)) store.userDict[k] = d.userDict[k]; });   // 辞書は不足分だけ追加
      mergeImages(d.images);
      const list = d.exams || (d.sections ? [d] : (d.userDict ? [] : null));
      if (!list) throw new Error('形式が違います');
      if (!list.length) { AUTO_CACHE.clear(); saveStore(); refresh(); toast('ルビ辞書を読み込みました'); return; }
      snapshot(true, '読み込み前');
      let first = null;
      list.forEach(ex => { const c = migrate(clone(ex)); c.id = uid(); c.name = c.name + '（読込 ' + fmtTime(Date.now()) + '）'; store.exams.push(c); first = first || c; });
      store.current = first.id; saveStore(); renderAll(); toast(`${list.length}件のテストを読み込みました（既存のテストは変更していません）`);
    } catch (e) { alert('読み込めませんでした。このアプリで保存したバックアップ(.json)を選んでください。\n' + e.message); }
  };
  fr.readAsText(file);
}

/* ---- 画像(図) ----
   画像の中身は exam の中に入れず store.images に1か所でまとめ、大問の図には id だけを持たせる。
   なぜ：履歴(snapshot)は exam を丸ごと写すので、中に画像があると同じ画像が最大40回保存されて容量があふれるため。
   id は画像の中身から作るので、同じ画像を何度入れても・複製しても1枚分で済む。
   どこからも使われなくなった画像は gcImages() で消す。履歴から使われている画像は残す(復元したときに図が消えないように)。 */
let imgsDirty = false;      // IndexedDB の控えに書き直す必要があるか
const getImg = id => (store && store.images[id]) || BUILTIN_IMAGES[id] || null;
const IMG_URL = new Map();  // 画面に出すときは data URL ではなく blob URL を使う(打つたびに数MBの文字列を組み直さないため)
function imgURL(id) {
  if (IMG_URL.has(id)) return IMG_URL.get(id);
  const im = getImg(id); if (!im) return '';
  const u = URL.createObjectURL(new Blob([dataBytes(im.data)], { type: im.data.slice(5).split(/[;,]/)[0] })); IMG_URL.set(id, u); return u;
}
function dataBytes(d) {   // data URL → バイト列
  const [head, body] = d.split(',');
  if (!/;base64$/.test(head)) return new TextEncoder().encode(decodeURIComponent(body));
  const bin = atob(body), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
const imgId = d => 'i' + hash32(d).toString(36) + hash32(d.slice(d.length >> 1) + d.length).toString(36) + d.length.toString(36);
function addImage(rec) { const id = imgId(rec.data); if (!store.images[id]) { store.images[id] = rec; imgsDirty = true; } return id; }
function usedImageIds(exams, snaps) {
  const u = new Set(), addF = list => (list || []).forEach(f => u.add(f.img));
  const add = ex => (ex.sections || []).forEach(s => { addF(s.figures); (s.items || []).forEach(it => { addF(it.figures); addF((it.choices || []).filter(c => c && c.img)); }); });
  exams.forEach(add); (snaps || []).forEach(sn => add(sn.exam));
  return u;
}
function pickImages(ids) { const o = {}; ids.forEach(id => { if (store.images[id]) o[id] = store.images[id]; }); return o; }
function mergeImages(images, into = store) {
  Object.keys(images || {}).forEach(k => { if (!into.images[k]) { into.images[k] = images[k]; if (into === store) imgsDirty = true; } });
}
function gcImages() {
  const u = usedImageIds(store.exams, store.snaps);
  Object.keys(store.images).forEach(k => { if (!u.has(k)) { delete store.images[k]; imgsDirty = true; } });
}
/* 起動時：IndexedDB の控えから画像を戻す(localStorage には画像を入れていないため) */
async function restoreImages() {
  try {
    const im = await idbGet('images'); if (!im) return;
    const n = Object.keys(store.images).length; mergeImages(im); imgsDirty = false;
    if (Object.keys(store.images).length > n) renderAll();
  } catch (e) { console.warn(e); }
}
/* 画像ファイルを読む。長い辺が IMG_MAX を超えたら縮める。図・線画は PNG のまま、写真(JPEG)は JPEG。
   PNG が大きすぎる(写真をスクリーンショットしたもの等)ときは、JPEG の方が半分以下なら JPEG にする */
async function loadImageFile(file) {
  const src = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('画像として開けませんでした（形式に対応していない可能性があります）')); i.src = src; });
  let w = im.naturalWidth, h = im.naturalHeight;
  if (!w || !h) throw new Error('画像の大きさが分かりませんでした');
  const jpeg = file.type === 'image/jpeg', svg = file.type === 'image/svg+xml';
  if (Math.max(w, h) <= IMG_MAX && (jpeg || file.type === 'image/png')) return { data: src, w, h, type: file.type };
  const k = svg ? IMG_MAX / Math.max(w, h) : Math.min(1, IMG_MAX / Math.max(w, h));   // SVG は大きく描いてから PNG にする(にじまないように)
  w = Math.round(w * k); h = Math.round(h * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h);

  return { data, w, h, type };
}
async function setChoiceImg(c, file) {   // 選択肢を図にする
  if (!/^image\//.test(file.type)) { toast('画像のファイル（PNG・JPEG など）を選んでください'); return; }
  try { c.img = addImage(await loadImageFile(file)); touch(); renderEditor(); toast('選択肢を図にしました'); }
  catch (e) { alert(`画像を読み込めませんでした。\n${e.message}\n\nPNG や JPEG の画像を選んでください。`); }
}
async function addFigures(s, files) {
  const list = [...files].filter(f => /^image\//.test(f.type));
  if (!list.length) { toast('画像のファイル（PNG・JPEG など）を選んでください'); return; }
  let n = 0;
  for (const f of list) {
    try { const id = addImage(await loadImageFile(f)); s.figures.push({ id: uid(), img: id, caption: '', width: 50, gray: false }); n++; }
    catch (e) { alert(`「${f.name || '貼り付けた画像'}」を読み込めませんでした。\n${e.message}\n\nPNG や JPEG の画像を選んでください。`); }
  }
  if (!n) return;
  touch(); renderEditor(); toast(`図を${n}枚入れました。見出しを入れると、本文で〔図:見出し〕と書いて番号を指せます`);
}
/* 本文などのカーソルの位置に〔図:見出し〕を入れる */
function insertFigRef(f) {
  const cap = plain(f.caption || '').trim();
  if (!cap) { toast('先に、この図の見出しを入れてください'); return; }
  const t = lastField;
  if (!t || !document.contains(t) || t.classList.contains('figcap') || t.classList.contains('codeta')) { toast('番号を入れたい入力欄（本文など）をクリックしてから押してください'); return; }
  const a = t.selectionStart ?? t.value.length, b = t.selectionEnd ?? a;
  t.value = t.value.slice(0, a) + `〔図:${cap}〕` + t.value.slice(b);
  t.dispatchEvent(new Event('input')); t.focus(); const p = a + cap.length + 4; t.setSelectionRange(p, p);
}

/* ---- データファイル(.json)への自動保存 ----
   なぜ：localStorage はブラウザの種類・アカウント・PCごとに別々で、「開く人によって中身が違う」混乱が起きたため(2026-10-29)。
   Chrome/Edge のファイルへの直接保存(File System Access API)で、先生が選んだ1つのファイルに変更のたびに上書きする。
   - 中身はバックアップJSONと同じ形(＋履歴など)。バックアップも、データファイルも「読み込み」で開ける。
   - 選んだファイルは IndexedDB に覚える(ファイルの目印は localStorage には入らないため)。
     ページを開き直すと、ブラウザの決まりで「編集を許可しますか」をもう一度聞かれることがある。ボタンを押してもらう必要がある。
   - 別の画面・別のPCが同じファイルを書き換えていたら(ファイルの更新日時で判断)、上書きせずに止めて知らせる。
   - localStorage は、データファイルを使っていないとき・保存できないときの予備として残している。 */
const DATA_FILE_NAME = 'テスト問題メーカー_データ.json';
const FILE_TYPES = [{ description: 'テスト問題メーカーのデータ', accept: { 'application/json': ['.json'] } }];
// state: unsupported(このブラウザは非対応) | none(未設定) | need(許可待ち) | ok | error(保存失敗) | conflict(別の所で変更された)
const DF = { handle: null, state: 'none', lastMod: 0, writing: false, again: false, dirty: false, savedAt: 0, err: '' };
const fsSupported = () => 'showSaveFilePicker' in window && 'showOpenFilePicker' in window && 'indexedDB' in window;

function idb(mode, fn) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('testmaker', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      const db = rq.result, tx = db.transaction('kv', mode), r = fn(tx.objectStore('kv'));
      tx.oncomplete = () => { db.close(); res(r.result); };
      tx.onerror = () => { db.close(); rej(tx.error); };
    };
  });
}
const idbGet = k => idb('readonly', s => s.get(k));
const idbSet = (k, v) => idb('readwrite', s => s.put(v, k));

function fileData() {
  store.exams.forEach(e => e.schema = SCHEMA);
  return { app: 'testmaker', kind: 'data', schema: SCHEMA, savedAt: new Date().toISOString(), current: store.current,
    exams: store.exams, userDict: store.userDict, snaps: store.snaps, images: store.images,
    lastBackupAt: store.lastBackupAt || 0, lastChangeAt: store.lastChangeAt || 0, lastSnapAt: store.lastSnapAt || 0 };
}
function storeFromData(d) {
  if (!d || d.app !== 'testmaker' || !Array.isArray(d.exams)) throw new Error('テスト問題メーカーのデータではありません');
  const s = { v: 1, current: d.current, exams: d.exams.map(migrate), snaps: d.snaps || [], userDict: d.userDict || {}, images: d.images || {},
    lastBackupAt: d.lastBackupAt || 0, lastChangeAt: d.lastChangeAt || 0, lastSnapAt: d.lastSnapAt || 0 };
  if (!s.exams.length) s.exams.push(sampleExam());
  if (!s.exams.find(e => e.id === s.current)) s.current = s.exams[0].id;
  return s;
}

/* データファイルに書く。書いている間に変更が来たら、終わってからもう一度書く */
async function dfWrite() {
  if (DF.state !== 'ok') return;
  if (DF.writing) { DF.again = true; return; }
  DF.writing = true; updateStatus();
  try {
    do {
      DF.again = false;
      const f = await DF.handle.getFile();
      if (DF.lastMod && f.lastModified !== DF.lastMod) { DF.state = 'conflict'; break; }
      const w = await DF.handle.createWritable();
      await w.write(JSON.stringify(fileData(), null, 1)); await w.close();
      DF.lastMod = (await DF.handle.getFile()).lastModified; DF.savedAt = Date.now();
    } while (DF.again);
    if (DF.state === 'ok') { DF.dirty = false; store.fileSavedAt = DF.savedAt; lsSave(); }
  } catch (e) { console.warn(e); DF.state = 'error'; DF.err = e.message || String(e); }
  DF.writing = false; renderFileBar(); updateStatus();
}

/* このブラウザの予備(localStorage)にだけある編集を、開いたデータファイルに足すか聞く */
function mergeLocal(s) {
  if (!store.lastChangeAt) return 0;                                              // ここでは何も編集していない(見本だけ)
  if (store.fileSavedAt && store.lastChangeAt <= store.fileSavedAt) return 0;     // データファイルの写しのまま
  // 前回データファイルに書いたあとに、ここで直したテスト(ファイル側と中身が違うもの)を拾う。どちらが新しいかでは決めない(両方で直したとき、黙って片方を消さないため)
  const byId = new Map(s.exams.map(e => [e.id, e])), since = store.fileSavedAt || 0;
  const extra = store.exams.filter(e => { const f = byId.get(e.id); return !f || ((e.updatedAt || 0) > since && JSON.stringify(e) !== JSON.stringify(f)); });
  if (!extra.length) return 0;
  if (!confirm(`このブラウザの中に、データファイルに入っていない（またはデータファイルと違う内容に直した）テストが ${extra.length} 件あります。\n\n`
    + extra.map(e => '・' + e.name).join('\n')
    + '\n\nデータファイルに加えますか？\n［OK］加える（同じテストは「このブラウザの分」として別に加えます）\n［キャンセル］加えない（このブラウザの中の分は、データファイルの内容に置き換わります）')) return 0;
  extra.forEach(e => { const c = clone(e); if (byId.has(c.id)) { c.id = uid(); c.name += '（このブラウザの分）'; } s.exams.push(c); });
  Object.keys(store.userDict || {}).forEach(k => { if (!(k in s.userDict)) s.userDict[k] = store.userDict[k]; });
  mergeImages(store.images, s);
  s.lastChangeAt = Date.now();
  return extra.length;
}

/* 許可済みのファイルを開いて、その中身を今のデータにする(空のファイルなら今の内容を書く) */
async function dfOpenHandle(hd) {
  const f = await hd.getFile(), text = await f.text();
  const s = text.trim() ? storeFromData(JSON.parse(text)) : null;
  DF.handle = hd; DF.lastMod = f.lastModified; DF.state = 'ok'; DF.err = ''; DF.savedAt = 0;
  try { await idbSet('dataFile', hd); } catch (e) { console.warn(e); }
  const merged = s ? mergeLocal(s) : 0;
  if (s) { s.fileSavedAt = Date.now(); store = s; imgsDirty = true; }
  if (merged || !s) saveStore(); else { DF.dirty = false; lsSave(); }
  renderAll(); renderFileBar(); updateStatus();
}
function dfFail(e, what) {
  console.warn(e);
  alert(`${what}。\n\n理由：${e.message || e}\n\n・Chrome か Edge で開いているか確かめてください。\n・ファイルが別の場所に移されていたら、「データファイルを開く」で選び直してください。\n・作ったテストは、このブラウザの中に控えとして残っています。`);
}
async function ask(hd) { return (await hd.queryPermission({ mode: 'readwrite' })) === 'granted' || (await hd.requestPermission({ mode: 'readwrite' })) === 'granted'; }
const NOT_ALLOWED = '編集が許可されなかったため、データファイルに保存できません。\nもう一度ボタンを押して、「ファイルを編集」（または「許可」）を選んでください。';

      if (isData && confirm(`「${hd.name}」には、すでにデータが入っています。\n［OK］このファイルを開く（おすすめ）\n［キャンセル］今の画面の内容で上書きする`)) { await dfOpenHandle(hd); $('#dlgFile').close(); toast(`データファイル「${hd.name}」を開きました`); return; }

async function dfReopen() {   // 前回のファイルを開き直す(許可待ち・別の所で変更されたとき)
  try { if (!await ask(DF.handle)) { alert(NOT_ALLOWED); return; } await dfOpenHandle(DF.handle); $('#dlgFile').close(); toast(`データファイル「${DF.handle.name}」を開きました`); }
  catch (e) { dfFail(e, 'データファイルを開けませんでした'); DF.state = 'need'; renderFileBar(); }
}
async function dfRetry() {    // 保存に失敗したあと、もう一度書く
  try { if (!await ask(DF.handle)) { alert(NOT_ALLOWED); return; } DF.state = 'ok'; DF.err = ''; saveStore(); }
  catch (e) { dfFail(e, 'データファイルに保存できませんでした'); }
}
function dfOverwrite() {
  if (!confirm('データファイルを、この画面の内容で上書きします。\n別の画面・別のパソコンで直した内容は、データファイルから消えます。\n（残したいときは、キャンセルして「ファイルを読み直す」を押してください）\n上書きしますか？')) return;
  DF.lastMod = 0; DF.state = 'ok'; saveStore();
}

async function dfInit() {
  if (!fsSupported()) { DF.state = 'unsupported'; renderFileBar(); return; }
  let hd = null; try { hd = await idbGet('dataFile'); } catch (e) { console.warn(e); }
  if (!hd) { DF.state = 'none'; renderFileBar(); openFileDialog(); return; }
  DF.handle = hd;
  try {
    if ((await hd.queryPermission({ mode: 'readwrite' })) === 'granted') { await dfOpenHandle(hd); return; }
  } catch (e) { console.warn(e); }
  DF.state = 'need'; renderFileBar(); openFileDialog();
}

/* 上部の帯：今どこに保存しているか */
function renderFileBar() {
  const bar = $('#fileBar'), b = (label, fn, cls = '') => h('button', { type: 'button', class: 'btn small ' + cls, onclick: fn }, label);
  const nm = DF.handle ? `「${DF.handle.name}」` : '';
  const set = (cls, ...kids) => { bar.className = 'filebar ' + cls; bar.replaceChildren(...kids); };
  if (DF.state === 'ok') set('', `データファイル${nm}に自動で保存しています。`, b('保存先を変える', () => openFileDialog(true)));
  else if (DF.state === 'need') set('warn', `⚠ データファイル${nm}をまだ開いていません。今の画面は、このブラウザの中の控えです。`, b('データファイルを開く', dfReopen, 'primary'));
  else if (DF.state === 'none') set('warn', '⚠ このブラウザの中にだけ保存しています（別のブラウザ・パソコンからは見えません）。', b('保存先のファイルを決める', () => openFileDialog(), 'primary'));
  else if (DF.state === 'error') set('bad', `⚠ データファイル${nm}に保存できませんでした（${DF.err}）。このブラウザの中には控えがあります。`, b('もう一度保存', dfRetry, 'primary'), b('保存先を変える', () => openFileDialog(true)));
  else if (DF.state === 'conflict') set('bad', `⚠ データファイル${nm}が、別の画面か別のパソコンで変更されました。上書きしないよう、自動保存を止めています。`, b('ファイルを読み直す', dfReopen, 'primary'), b('この画面の内容で上書き', dfOverwrite));
  else set('warn', '⚠ このブラウザはファイルへの保存に対応していません。Chrome か Edge で開いてください（今はこのブラウザの中にだけ保存しています）。');
}

/* =====================================================================
   6. 画面
   ===================================================================== */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const btn = (label, fn, title, cls = '') => h('button', { type: 'button', class: 'btn small ' + cls, title: title || '', onclick: fn }, label);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 3200); }
function move(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return false; [arr[i], arr[j]] = [arr[j], arr[i]]; return true; }

function bindText(obj, key, o = {}) {
  const tag = o.tag || 'input';
  const e = h(tag, { type: tag === 'input' ? (o.type || 'text') : null, placeholder: o.ph, rows: o.rows, class: o.cls || '', min: o.min, max: o.max, step: o.step });
  e.value = obj[key] ?? '';
  e.addEventListener('input', () => { obj[key] = o.type === 'number' ? num(e.value, 0) : e.value; touch(); });
  return e;
}
function bindSelect(obj, key, opts, o = {}) {
  const e = h('select', {}, opts.map(([v, l]) => h('option', { value: v }, l)));
  e.value = String(obj[key]);
  e.addEventListener('change', () => { obj[key] = o.numeric ? Number(e.value) : e.value; touch(); if (o.redraw) renderEditor(); });
  return e;
}
function bindCheck(obj, key, label) {
  const e = h('input', { type: 'checkbox' }); e.checked = !!obj[key];
  e.addEventListener('change', () => { obj[key] = e.checked; touch(); });
  return h('label', { class: 'row', style: 'gap:6px;margin:6px 0' }, e, label);
}
const field = (label, input, hint) => h('label', { class: 'field' }, h('span', {}, label), input, hint ? h('div', { class: 'hint' }, hint) : null);
