/* 大問のコードの欄(プログラム)：書いたとおりに等幅の字で出す。語群選択の大問では {{ }} で空欄にできる */
function codePanel(s) {
  if (s.code == null) return h('div', { class: 'row', style: 'margin:4px 0' },
    btn('＋ コードの欄を追加', () => { s.code = ''; touch(); renderEditor(); }, 'プログラムを、書いたとおりの字下げで枠に入れて出します'));
  const bk = s.codeKind === 'blocks';
  const ta = h('textarea', { rows: bk ? 8 : 6, class: 'codeta' + (bk ? ' blockta' : ''), spellcheck: 'false', wrap: 'off',
    placeholder: bk ? '例）\n最初だけ\n  アイコンを表示 ♥\nずっと\n  もし <ボタンAが押されている> なら\n    数を表示 (5)\n  でなければ\n    表示を消す' : '例）\ntotal = 0\nfor i in range(1, 11):\n    total = total + i' });
  ta.value = s.code;
  ta.addEventListener('input', () => { s.code = ta.value; touch(); });
  ta.addEventListener('keydown', e => {   // Tab で字下げ(空白4つ)。ふつうは次の入力欄へ移ってしまうため
    if (e.key !== 'Tab' || e.shiftKey) return;
    e.preventDefault(); const a = ta.selectionStart, b = ta.selectionEnd;
    const sp = bk ? '  ' : '    ';   // ブロックは空白2つで1段
    ta.value = ta.value.slice(0, a) + sp + ta.value.slice(b); ta.setSelectionRange(a + sp.length, a + sp.length); s.code = ta.value; touch();
  });
  const toBlank = () => {
    const a = ta.selectionStart, b = ta.selectionEnd;
    if (a === b) { toast('コードの中で、空欄にしたい部分を選択してから押してください'); return; }
    const sel = ta.value.slice(a, b);
    if (/\n/.test(sel)) { toast('1行の中で選択してください'); return; }
    ta.value = ta.value.slice(0, a) + '{{' + sel + '}}' + ta.value.slice(b);
    s.code = ta.value; const p = a + 4 + sel.length; ta.setSelectionRange(p, p); ta.focus(); touch();
  };
  const ln = h('input', { type: 'checkbox' }); ln.checked = !!s.codeLines;
  ln.addEventListener('change', () => { s.codeLines = ln.checked; touch(); });
  return h('div', { class: 'sub' },
    h('div', { class: 'qhead' }, h('b', {}, 'コードの欄（プログラム）'), h('span', { class: 'spacer' }),
      h('label', { class: 'row', style: 'gap:4px' }, h('span', { class: 'hint', style: 'margin:0' }, '種類'), bindSelect(s, 'codeKind', Object.entries(CODE_KIND), { redraw: true })),
      h('label', { class: 'row', style: 'gap:4px' }, h('span', { class: 'hint', style: 'margin:0' }, '置き場所'), bindSelect(s, 'codePos', Object.entries(CODE_POS))),
      bk ? h('label', { class: 'row', style: 'gap:4px' }, '大きさ', bindText(s, 'blockScale', { type: 'number', min: 30, max: 200, step: 10, cls: 'w5' }), '%')
         : h('label', { class: 'row', style: 'gap:4px' }, ln, '行番号'),
      btn('コードの欄を消す', () => { if (s.code.trim() && !confirm('コードの欄を消しますか？\n（直前の状態は「履歴」に残ります）')) return; snapshot(true, 'コードの欄の削除前'); s.code = null; touch(); renderEditor(); }, '', 'danger')),
    ta,
    bk ? h('div', { class: 'hint' }, '1行に1つのブロック。中に入るブロックは、空白2つ（Tab キー）で字下げします。',
      h('code', {}, '(100)'), ' は値の枠、', h('code', {}, '<…>'), ' は条件の枠、「もし」と同じ字下げの「でなければ」は2段のブロックになります。ルビ ', h('code', {}, '[漢字|かな]'), ' も使えます。') : null,
    s.type === 'blank'
      ? h('div', { class: 'row', style: 'margin-top:4px' },
          h('button', { type: 'button', class: 'btn small primary', onmousedown: e => e.preventDefault(), onclick: toBlank }, '選択した部分を空欄にする'),
          h('span', { class: 'hint', style: 'margin:0' }, '本文と同じく ', h('code', {}, '{{答え}}'), ' が空欄になり、番号・語群・正答が自動で付きます。'))
      : h('div', { class: 'hint' }, '字下げは書いたとおりに出ます（Tab キーで空白4つ）。空欄 {{ }} を使えるのは、語群選択の大問だけです。'));
}

/* 設問の箱：この中で貼り付け・ドラッグした画像は、その設問の図にする(外側の大問のカードまで伝えない) */
function itemBox(it, ...kids) {
  const box = h('div', { class: 'sub' }, ...kids, figPanel(it, true));
  box.addEventListener('paste', e => {
    const fs = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => /^image\//.test(f.type));
    if (fs.length) { e.preventDefault(); e.stopPropagation(); addFigures(it, fs); }
  });
  box.addEventListener('drop', e => {
    if (!e.dataTransfer.files.length) return;
    e.preventDefault(); e.stopPropagation(); box.closest('.card').classList.remove('drop'); addFigures(it, e.dataTransfer.files);
  });
  return box;
}

let lastField = null;
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('#editor input[type=text], #editor textarea')) lastField = e.target; });
function addRuby() {
  const f = lastField;
  if (!f || !document.contains(f)) { toast('ルビを付けたい語句を、入力欄の中で選択してから押してください'); return; }
  if (f.classList.contains('codeta') && !f.classList.contains('blockta')) { toast('文字のコードの欄にはルビを付けられません（書いたとおりに出すため）'); return; }
  const a = f.selectionStart, b = f.selectionEnd;
  if (a == null || a === b) { toast('ルビを付けたい語句を、入力欄の中で選択してから押してください'); return; }
  const sel = f.value.slice(a, b);
  if (/[\[\]|\n]/.test(sel)) { toast('その範囲にはルビを付けられません（[ ] | 改行を含まない範囲を選択）'); return; }
  const r = prompt(`「${sel}」の読みがな`, ''); if (!r || !r.trim()) return;
  f.value = f.value.slice(0, a) + '[' + sel + '|' + r.trim() + ']' + f.value.slice(b);
  f.dispatchEvent(new Event('input')); f.focus();
}
function renderEditor() {

  const tool = h('div', { class: 'edtool' },

    chk('showRuby', 'ルビを表示'),

/* ---- プレビュー・警告・状態表示 ---- */
let C = null, _rt = null;

  fitPreview();

  w.innerHTML = C.warnings.length
    ? `<div class="warns"><b>確認してください（${C.warnings.length}件）</b><ul>${C.warnings.map(x => `<li>大問${x.sec}：${esc(x.msg)}</li>`).join('')}</ul></div>`
    : `<div class="warns ok">警告はありません</div>`;
  // 編集欄の自動表示（番号・空欄一覧）
  document.querySelectorAll('[data-qid]').forEach(el => { const no = C.itemNo[el.dataset.qid]; el.textContent = no == null ? '' : `（${no}）`; });
  document.querySelectorAll('[data-fig]').forEach(el => { const no = C.figNo[el.dataset.fig]; el.textContent = no == null ? '' : '図' + zen(no); });
  document.querySelectorAll('[data-map]').forEach(el => {

    const items = sec.blankMap.map(b => `（${zen(b.n)}）→<b>${esc(b.label)}</b> ${esc(plain(b.term))}`);
    el.innerHTML = '<b>自動で決まった正解</b>：' + (items.length ? items.join('　／　') : '（空欄がまだありません）');
  });

  updateStatus();
}
/* ---- 〇ページに収める ----
   印刷のページ数を画面の上で見積もる：用紙を印刷と同じ幅で見えない所に描き、ページの切れ目の決まりをまねて数える
   (表・設問・語群・図などは途中で切らない、見出しは次と離さない、「大問の途中で変えない」なら大問ごと送る)。
   Word はページの分け方を Word が決めるので、1ページずれることがある */
function countPages(ex, over) {
  const m = { ...ex.meta, ...over }, mg = mgOf(m);
  const keepR = { RUBY, AUTO };
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden';
  box.innerHTML = `<div class="sheet${m.showRuby ? ' ruby-on' : ''}" style="${sheetStyle(m)};padding:0 ${mg.x}mm;box-shadow:none">${renderPaperHTML(compile({ ...ex, meta: m }))}</div>`;
  RUBY = keepR.RUBY; AUTO = keepR.AUTO;
  document.body.append(box);
  const sheet = box.firstChild, px = 96 / 25.4, pageH = (297 - mg.t - mg.b) * px;
  // 数える部品：切ってよい(split)＝本文の段落・本文の右に図のある塊、見出し＝次と離さない(keepNext)
  const atoms = [];
  [...sheet.children].forEach(el => {
    if (el.tagName !== 'SECTION') { atoms.push({ el }); return; }
    const sn = atoms.filter(a => a.first).length;   // 何番目の大問か(0 = 大問1)
    [...el.children].forEach((c, i) => atoms.push({ el: c, sec: el, sn, first: i === 0, keepNext: c.tagName === 'H2', split: c.matches('.para, .figrow') }));
  });
  const end = sheet.getBoundingClientRect().bottom;
  atoms.forEach(a => { const r = a.el.getBoundingClientRect(); a.top = r.top; a.bot = r.bottom; });
  // h = 次の部品までの高さ(下の余白を含む)、hv = 見える高さ。ページの最後の部品の下の余白は、印刷では次のページに持ち越されない
  atoms.forEach((a, i) => { a.h = (i + 1 < atoms.length ? atoms[i + 1].top : end) - a.top; a.hv = Math.min(a.h, a.bot - a.top); });
  atoms.forEach(a => { if (a.first) a.secH = a.sec.getBoundingClientRect().bottom - a.top; });   // 大問の見える高さ(下の余白を除く)
  box.remove();
  let pages = 1, y = 0;
  const next = () => { pages++; y = 0; };
  atoms.forEach((a, i) => {
    if (a.first && y > 0) {
      if (m.pageMode === 'section') { if (a.sn > 0) next(); }   // 大問1の前では改ページしない(印刷と同じ)
      else if (m.pageMode === 'keep' && a.secH <= pageH && y + a.secH > pageH) next();
    }
    const nx = atoms[i + 1];
    if (a.keepNext && nx && y > 0 && y + a.h + Math.min(nx.h, pageH * 0.25) > pageH) next();
    if (!a.split && y > 0 && y + a.hv > pageH) next();
    const vis = y + a.hv;
    if (vis > pageH) { const k = Math.ceil(vis / pageH) - 1; pages += k; y -= k * pageH; }   // 1ページより長い部品・段落
    y += a.h;
  });
  return pages;
}
/* 読みやすい順に試して、指定のページ数に入る最初の設定にする(字の大きさ → 行間 → 余白の順に詰める) */
const FIT_ORDER = [[12, 'loose', 'normal'], [12, 'normal', 'normal'], [11, 'loose', 'normal'], [11, 'normal', 'normal'], [11, 'tight', 'normal'], [11, 'normal', 'narrow'], [11, 'tight', 'narrow'],
  [10.5, 'normal', 'normal'], [10.5, 'tight', 'normal'], [10.5, 'tight', 'narrow'], [10, 'normal', 'normal'], [10, 'tight', 'normal'], [10, 'tight', 'narrow']];
function fitToPages() {
  const ex = cur(), N = Math.max(1, Math.round(num(ex.meta.fitPages, 2)));
  let hit = null, last = 0;
  for (const [size, lineSpacing, margin] of FIT_ORDER) {
    last = countPages(ex, { size, lineSpacing, margin });
    if (last <= N) { hit = { size, lineSpacing, margin, pages: last }; break; }
  }
  if (!hit) {
    const tip = ex.meta.pageMode !== 'flow' ? '\n（改ページを「続けて詰める」にすると、大問の途中でもページが変わるので、もう少し詰まります）' : '';
    alert(`いちばん小さくしても ${N} ページに収まりません（約 ${last} ページになります）。\n問題を減らすか、ページ数を増やしてください。${tip}`); return;
  }
  Object.assign(ex.meta, { size: hit.size, lineSpacing: hit.lineSpacing, margin: hit.margin });
  AUTO_CACHE.clear(); touch(); renderEditor();
  alert(`${N} ページに収まるように、次の設定にしました（印刷で約 ${hit.pages} ページ）。\n\n文字の大きさ：${hit.size}pt\n行間：${LINE_SPACING[hit.lineSpacing][0]}\n余白：${MARGINS[hit.margin][0]}\n\nWord では、ページの分け方を Word が決めるので、1ページずれることがあります。\nこのあと、手で直してもかまいません。`);
}

/* ---- 自動ルビ：辞書エンジン(ruby-engine.js)の読み込み ---- */
let engState = 'idle';        // idle | loadingScript | loadingDict | ready | missing | error
const engWaiters = [];
const needEngine = ex => !!(ex.meta.showRuby && ex.meta.autoRuby);
function setRubyStat() {
  const el = $('#rubyStat'); if (!el) return;
  el.textContent = { loadingScript: '辞書を読み込み中…', loadingDict: '辞書を準備中…（数秒）', ready: '自動ルビ：準備完了',
    missing: '⚠ ruby-engine.js が同じフォルダにないため、手入力と登録辞書のルビだけです', error: '⚠ 辞書の読み込みに失敗しました' }[engState] || '';
  el.style.color = /^⚠/.test(el.textContent) ? 'var(--warn)' : '';
}
function ensureEngine(cb) {
  if (window.RubyEngine && window.RubyEngine.ready) { engState = 'ready'; cb && cb(true); return; }
  if (cb) engWaiters.push(cb);
  const flush = ok => engWaiters.splice(0).forEach(f => f(ok));
  if (engState === 'loadingScript' || engState === 'loadingDict') return;
  if (engState === 'missing' || engState === 'error') { flush(false); return; }
  const startDict = () => {
    engState = 'loadingDict'; setRubyStat();
    window.RubyEngine.load(err => { engState = err ? 'error' : 'ready'; AUTO_CACHE.clear(); setRubyStat(); flush(!err); refreshSoon(); });
  };
  if (window.RubyEngine) { startDict(); return; }
  engState = 'loadingScript'; setRubyStat();
  const sc = document.createElement('script'); sc.src = 'ruby-engine.js';
  sc.onload = startDict; sc.onerror = () => { engState = 'missing'; setRubyStat(); flush(false); refreshSoon(); };
  document.head.append(sc);
}
/* 出力の前に辞書の準備を待つ */
function withEngine(fn) {
  const ex = cur();
  if (!needEngine(ex) || engState === 'ready') { fn(); return; }
  const ask = () => { if (confirm('自動ルビ用の辞書（ruby-engine.js）が使えません。\n手入力と登録辞書のルビだけで出力しますか？')) fn(); };
  if (engState === 'missing' || engState === 'error') { ask(); return; }
  toast('ルビ辞書を読み込み中です。少しお待ちください…');
  ensureEngine(ok => ok ? fn() : ask());
}

/* ---- ルビの確認・辞書ダイアログ ---- */
function collectRubyWords() {
  const ex = cur(), keep = { RUBY, AUTO };
  AUTO_CACHE.clear(); RUBY_LOG = new Map();
  try { renderPaperHTML(compile(ex), true); } finally { var log = RUBY_LOG; RUBY_LOG = null; RUBY = keep.RUBY; AUTO = keep.AUTO; AUTO_CACHE.clear(); }
  return log;
}

      const bar = h('div', { class: 'row', style: 'margin-bottom:6px' });
      const sel = h('select', {}, h('option', { value: 'all' }, 'すべて'), h('option', { value: 'auto' }, '未確認（自動の読み）のみ'), h('option', { value: 'none' }, '読みなしのみ'));
      bar.append(sel, btn('自動の読みをすべて確定して登録', () => {
        let n = 0; log.forEach((v, k) => { if (v.src === 'auto' && v.reading) { store.userDict[k] = v.reading; n++; } });
        dictChanged(); draw(); toast(`${n}語を登録しました`);
      }, '今表示されている自動の読みを、そのまま辞書へ登録します'));
      body.append(bar);
      const tb = h('table', { class: 'hist' }, h('tr', {}, h('th', {}, '語'), h('th', {}, '読み'), h('th', {}, '状態'), h('th', {}, '')));
      log.forEach((v, word) => {
        const inp = h('input', { type: 'text', style: 'width:100%;border:1px solid var(--line);border-radius:6px;padding:3px 6px' }); inp.value = v.reading;
        const st = h('td', {}), ops = h('td', {});
        const label = () => { const ud = word in store.userDict; st.textContent = ud ? (store.userDict[word] ? '登録済み' : 'ルビなし（登録）') : (v.src === 'std' ? '標準辞書' : inp.value ? '自動（未確認）' : '読みなし'); st.style.color = ud ? 'var(--ok)' : (inp.value ? 'var(--sub)' : 'var(--warn)'); tr.dataset.st = ud || v.src === 'std' ? 'dict' : (inp.value ? 'auto' : 'none'); };
        const commit = () => { const val = hira(inp.value.trim()); store.userDict[word] = val; inp.value = val; dictChanged(); label(); };
        inp.addEventListener('change', commit);
        ops.append(btn('↺', () => { delete store.userDict[word]; dictChanged(); draw(); }, '登録を消して自動の読みに戻す'));
        const tr = h('tr', {}, h('td', { style: 'font-weight:700;white-space:nowrap' }, word), h('td', {}, inp), st, ops);
        label(); tb.append(tr);
      });
      sel.addEventListener('change', () => tb.querySelectorAll('tr[data-st]').forEach(tr => tr.style.display = (sel.value === 'all' || tr.dataset.st === sel.value) ? '' : 'none'));
      body.append(tb);
      if (!log.size) body.append(h('p', {}, '漢字を含む語がまだありません。'));
    } else {
      const q = h('input', { type: 'text', placeholder: '語を検索', style: 'border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin-bottom:6px' });
      const tb = h('table', { class: 'hist' }, h('tr', {}, h('th', {}, '語'), h('th', {}, '読み'), h('th', {}, '')));
      const fill = () => { tb.querySelectorAll('tr.d').forEach(x => x.remove());
        Object.keys(store.userDict).filter(k => k.includes(q.value)).sort().forEach(k => tb.append(h('tr', { class: 'd' }, h('td', { style: 'font-weight:700' }, k), h('td', {}, store.userDict[k] || '（ルビなし）'),
          h('td', {}, btn('削除', () => { delete store.userDict[k]; dictChanged(); draw(); }, '', 'danger'))))); };
      q.addEventListener('input', fill); fill();
      body.append(h('div', { class: 'row', style: 'margin-bottom:6px' }, btn('辞書をファイルに保存', () => {
          download(new Blob([JSON.stringify({ app: 'testmaker-dict', words: store.userDict }, null, 1)], { type: 'application/json' }), `ルビ辞書_${stamp()}.json`); }, '他の先生に渡す・別のPCで使うとき'),
        btn('辞書ファイルを読み込む', () => $('#dictIn').click(), '足りない語だけ追加します（既存の登録は上書きしません）')),
        h('p', { class: 'hint' }, '辞書は「バックアップ保存」にも含まれます。'), q, tb);
    }
    dlg.replaceChildren(body);
  };
  const run = () => { draw(); if (!dlg.open) dlg.showModal(); };
  if (engState === 'ready' || engState === 'missing' || engState === 'error') run(); else { toast('辞書を準備しています…'); ensureEngine(run); }
}

/* ---- 起動 ---- */
store = loadStore();
setupButtons();
renderAll();
saveStore();
restoreImages().then(dfInit);
</script>
</body>
</html>
